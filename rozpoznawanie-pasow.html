<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rozpoznawanie pasów</title>
<style>
  :root { --bg:#f4f5f7; --pn:#fff; --tx:#1d2330; --mu:#667085; --ac:#2f6fae; --bd:#d8dce3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --pn:#1b212b; --tx:#e6e9ef; --mu:#97a1b3; --ac:#6aa8e6; --bd:#2f3745; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.4 system-ui, sans-serif; }
  #app { display:flex; flex-wrap:wrap; gap:12px; padding:12px; }
  #panel { flex:0 0 300px; background:var(--pn); border:1px solid var(--bd); border-radius:10px; padding:10px 12px; }
  #main { flex:1 1 600px; min-width:0; display:flex; flex-direction:column; gap:10px; }
  label { display:flex; justify-content:space-between; gap:8px; margin:5px 0; align-items:center; }
  input { width:120px; padding:3px 6px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--tx); }
  button { padding:6px 12px; border-radius:7px; border:1px solid var(--ac); background:var(--ac); color:#fff; cursor:pointer; margin:4px 4px 0 0; }
  button.sec { background:transparent; color:var(--ac); }
  canvas { max-width:100%; border-radius:8px; background:#222; display:block; }
  #msg { color:var(--mu); font-size:12px; margin:6px 0; white-space:pre-wrap; }
  #res { font-size:13px; } #res table { border-collapse:collapse; width:100%; } #res td { border-top:1px solid var(--bd); padding:2px 4px; }
  .big { font-size:18px; font-weight:600; margin:6px 0; }
  h1 { font-size:16px; margin:0 0 6px; } small { color:var(--mu); }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>Rozpoznawanie pasów z ortofoto</h1>
    <small>Bierze oś drogi z OSM, pobiera ortofoto Geoportalu, prostuje pas wzdłuż osi i szuka białych linii. Wynik to propozycja do porównania z tagiem <code>lanes</code>. Kliknięcie na zdjęcie wybiera inną drogę.</small>
    <label>Szer. geo. <input id="lat" value="54.5009531"></label>
    <label>Dł. geo. <input id="lon" value="18.5368382"></label>
    <label>Długość odcinka [m] <input id="len" type="number" value="80"></label>
    <label>Skan w bok ± [m] <input id="half" type="number" value="10"></label>
    <label>Próg jasności <input id="thr" type="number" value="26"></label>
    <button id="go">Rozpoznaj</button><button id="exp" class="sec">Eksport JSON</button>
    <div id="msg"></div>
    <div id="res"></div>
  </div>
  <div id="main">
    <canvas id="cvO" width="900" height="560"></canvas>
    <canvas id="cvS" width="900" height="260"></canvas>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const R = 20037508.342789244;
const toM = (lon, lat) => [lon / 180 * R, Math.log(Math.tan((90 + lat) * Math.PI / 360)) * R / Math.PI];
const toLL = (x, y) => [x / R * 180, Math.atan(Math.exp(y / R * Math.PI)) * 360 / Math.PI - 90];
const ROAD = /^(motorway|trunk|primary|secondary|tertiary|unclassified|residential)(_link)?$/;
const log = t => { $('msg').textContent = t; };
let LAST = null;

async function fetchT(url, ms) { const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms); try { return await fetch(url, { signal: ac.signal }); } finally { clearTimeout(t); } }

async function loadWays(lat, lon) {
  const tx = Math.floor(lon / 0.02), ty = Math.floor(lat / 0.01), out = [];
  for (let x = tx - 1; x <= tx + 1; x++) for (let y = ty - 1; y <= ty + 1; y++) {
    try { const r = await fetchT(`data/roads/gdynia/${x}_${y}.json`, 15000); if (r.ok) out.push(...await r.json()); } catch (e) {}
  }
  return out;
}

// najbliższa droga (ruch kołowy) do punktu
function nearestWay(ways, P) {
  let best = null;
  for (const w of ways) {
    if (!ROAD.test(w.t.highway || '')) continue;
    const g = w.g.map(c => toM(c[0], c[1]));
    for (let i = 0; i + 1 < g.length; i++) {
      const [ax, ay] = g[i], [bx, by] = g[i + 1], vx = bx - ax, vy = by - ay, L2 = vx * vx + vy * vy || 1;
      const u = Math.max(0, Math.min(1, ((P[0] - ax) * vx + (P[1] - ay) * vy) / L2));
      const d = Math.hypot(ax + u * vx - P[0], ay + u * vy - P[1]);
      if (!best || d < best.d) best = { d, w, g, i, u };
    }
  }
  return best;
}

// próbkowanie osi co ds (w jednostkach merkatora)
function resample(g, ds) {
  const pts = []; let s0 = 0, next = 0;
  for (let i = 0; i + 1 < g.length; i++) {
    const [ax, ay] = g[i], [bx, by] = g[i + 1], L = Math.hypot(bx - ax, by - ay);
    while (next <= s0 + L) { const t = (next - s0) / (L || 1); pts.push([ax + (bx - ax) * t, ay + (by - ay) * t, next]); next += ds; }
    s0 += L;
  }
  return pts;
}

async function run() {
  const lat = +$('lat').value, lon = +$('lon').value, LEN = +$('len').value, HALF = +$('half').value, THR = +$('thr').value;
  const k = Math.cos(lat * Math.PI / 180); // m terenu = merc * k
  log('Wczytuję drogi OSM…');
  const ways = await loadWays(lat, lon), P = toM(lon, lat), nw = nearestWay(ways, P);
  if (!nw || nw.d * k > 40) { log('Brak drogi w promieniu 40 m.'); return; }
  const DS = 0.5 / k, all = resample(nw.g, DS);
  // stacja punktu na osi
  let s0 = 0, bd = 1e18; for (const p of all) { const d = Math.hypot(p[0] - P[0], p[1] - P[1]); if (d < bd) { bd = d; s0 = p[2]; } }
  const pts = all.filter(p => Math.abs(p[2] - s0) <= LEN / 2 / k);
  if (pts.length < 20) { log('Za krótki odcinek drogi.'); return; }
  // styczne (wygładzone ±3 m) i normalne w lewo
  const nW = Math.round(3 / 0.5);
  for (let i = 0; i < pts.length; i++) { const a = pts[Math.max(0, i - nW)], b = pts[Math.min(pts.length - 1, i + nW)], L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; pts[i].tx = (b[0] - a[0]) / L; pts[i].ty = (b[1] - a[1]) / L; }
  // bbox + ortofoto
  const pad = (HALF + 3) / k; let x0 = 1e18, y0 = 1e18, x1 = -1e18, y1 = -1e18;
  for (const p of pts) { x0 = Math.min(x0, p[0] - pad); x1 = Math.max(x1, p[0] + pad); y0 = Math.min(y0, p[1] - pad); y1 = Math.max(y1, p[1] + pad); }
  let res = 0.06 / k; const ext = Math.max(x1 - x0, y1 - y0); if (ext / res > 2048) res = ext / 2048;
  const IW = Math.round((x1 - x0) / res), IH = Math.round((y1 - y0) / res);
  const t = nw.w.t;
  log(`Droga: ${t.name || '(bez nazwy)'} ${t.highway}, OSM way ${nw.w.i}, lanes=${t.lanes || '?'}\nPobieram ortofoto ${IW}×${IH} px (${(res * k * 100).toFixed(1)} cm/px)…`);
  let bmp = null;
  for (const srv of ['HighResolution', 'StandardResolution']) {
    const url = `https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/${srv}?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=Raster&STYLES=&FORMAT=image/jpeg&TRANSPARENT=FALSE&CRS=EPSG:3857&WIDTH=${IW}&HEIGHT=${IH}&BBOX=${x0},${y0},${x1},${y1}`;
    for (let a = 0; a < 3 && !bmp; a++) { try { const r = await fetchT(url, 40000); if (r.ok && (r.headers.get('content-type') || '').includes('image')) bmp = await createImageBitmap(await r.blob()); else await new Promise(q => setTimeout(q, 800 * (a + 1))); } catch (e) { log($('msg').textContent + `\n${srv}: ${e.name}`); } }
    if (bmp) { if (srv !== 'HighResolution') log($('msg').textContent + '\nUżyto StandardResolution (gorsza rozdzielczość).'); break; }
  }
  if (!bmp) { log($('msg').textContent + '\nGeoportal nie odpowiedział. Spróbuj ponownie.'); return; }
  const oc = new OffscreenCanvas(IW, IH), ox = oc.getContext('2d'); ox.drawImage(bmp, 0, 0); const img = ox.getImageData(0, 0, IW, IH).data;
  const px = (X, Y) => { // dwuliniowo, zwraca [r,g,b]
    const u = (X - x0) / res - 0.5, v = (y1 - Y) / res - 0.5, i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j, o = [0, 0, 0];
    if (i < 0 || j < 0 || i + 1 >= IW || j + 1 >= IH) return null;
    for (let c = 0; c < 3; c++) { const q = (jj, ii) => img[(jj * IW + ii) * 4 + c]; o[c] = (q(j, i) * (1 - fu) + q(j, i + 1) * fu) * (1 - fv) + (q(j + 1, i) * (1 - fu) + q(j + 1, i + 1) * fu) * fv; }
    return o;
  };
  // wyprostowany pas: wiersze = stacja, kolumny = odsunięcie d (+ w lewo)
  const DD = 0.1, NC = Math.round(2 * HALF / DD) + 1, NR = pts.length, dOf = c => -HALF + c * DD;
  const strip = new Uint8ClampedArray(NR * NC * 4), lum = new Float32Array(NR * NC), sat = new Float32Array(NR * NC);
  for (let r = 0; r < NR; r++) { const p = pts[r], nx = -p.ty, ny = p.tx;
    for (let c = 0; c < NC; c++) { const d = dOf(c) / k, v = px(p[0] + nx * d, p[1] + ny * d) || [0, 0, 0], q = (r * NC + c);
      strip[q * 4] = v[0]; strip[q * 4 + 1] = v[1]; strip[q * 4 + 2] = v[2]; strip[q * 4 + 3] = 255;
      lum[q] = (v[0] + v[1] + v[2]) / 3; sat[q] = Math.max(...v) - Math.min(...v); } }
  // linie w każdym wierszu: jasny, szary, wąski (6–45 cm) pasek jaśniejszy od otoczenia ±0,75 m
  const BW = Math.round(0.75 / DD), hit = new Uint8Array(NR * NC);
  for (let r = 0; r < NR; r++) { const o = r * NC, cs = new Float32Array(NC + 1); for (let c = 0; c < NC; c++) cs[c + 1] = cs[c] + lum[o + c];
    let st = -1;
    for (let c = 0; c <= NC; c++) {
      let on = false; if (c < NC) { const a = Math.max(0, c - BW), b = Math.min(NC, c + BW + 1), m = (cs[b] - cs[a]) / (b - a); on = lum[o + c] - m > THR && lum[o + c] > 120 && sat[o + c] < 50; }
      if (on && st < 0) st = c; if (!on && st >= 0) { const w = (c - st) * DD; if (w >= 0.06 && w <= 0.45) hit[o + Math.round((st + c - 1) / 2)] = 1; st = -1; }
    } }
  const occ = new Float32Array(NC); for (let c = 0; c < NC; c++) { let n = 0; for (let r = 0; r < NR; r++) n += hit[r * NC + c] | (c > 0 && hit[r * NC + c - 1]) | (c + 1 < NC && hit[r * NC + c + 1]); occ[c] = n / NR; }
  // piki profilu = linie podłużne
  const peaks = [];
  for (let c = 1; c + 1 < NC; c++) if (occ[c] >= 0.10 && occ[c] >= occ[c - 1] && occ[c] > occ[c + 1]) peaks.push(c);
  peaks.sort((a, b) => occ[b] - occ[a]); const keep = [];
  for (const c of peaks) if (keep.every(q => Math.abs(q - c) * DD > 1.2)) keep.push(c);
  keep.sort((a, b) => a - b);
  const lines = keep.map(c => { let on = 0, tr = 0, prev = 0; for (let r = 0; r < NR; r++) { let h = 0; for (let e = -2; e <= 2; e++) if (c + e >= 0 && c + e < NC) h |= hit[r * NC + c + e]; on += h; if (r && h !== prev) tr++; prev = h; }
    const f = on / NR; return { d: +dOf(c).toFixed(2), pokrycie: +f.toFixed(2), typ: f > 0.7 ? 'ciągła' : tr >= 4 ? 'przerywana' : 'niepewna', c }; });
  // jezdnia = ciągły obszar „asfaltu” (szary, niskie nasycenie) wokół osi; krawędzie tam, gdzie asfalt się kończy
  const asph = new Float32Array(NC);
  for (let c = 0; c < NC; c++) { let n = 0; for (let r = 0; r < NR; r++) { const q = r * NC + c; n += (sat[q] < 30 && lum[q] > 60 && lum[q] < 200) || hit[q] ? 1 : 0; } asph[c] = n / NR; }
  const sm = Array.from(asph, (_, c) => { let a = 0, n = 0; for (let e = -3; e <= 3; e++) if (asph[c + e] !== undefined) { a += asph[c + e]; n++; } return a / n; });
  const c0 = Math.round(HALF / DD), GAP = Math.round(0.6 / DD); let cl = c0, cr = c0;
  for (let c = c0, miss = 0; c < NC && miss <= GAP; c++) { if (sm[c] >= 0.6) { cl = c; miss = 0; } else miss++; }
  for (let c = c0, miss = 0; c >= 0 && miss <= GAP; c--) { if (sm[c] >= 0.6) { cr = c; miss = 0; } else miss++; }
  const edges = [+dOf(cr).toFixed(2), +dOf(cl).toFixed(2)];
  window.DBG = { d: [], sm: [], lum: [], sat: [], sd: [] }; for (let c = 0; c < NC; c += 5) { let a = 0, b = 0, v = 0; for (let r = 0; r < NR; r++) { a += lum[r * NC + c]; b += sat[r * NC + c]; } a /= NR; b /= NR; for (let r = 0; r < NR; r++) v += (lum[r * NC + c] - a) ** 2; DBG.d.push(+dOf(c).toFixed(1)); DBG.sm.push(+sm[c].toFixed(2)); DBG.lum.push(Math.round(a)); DBG.sat.push(Math.round(b)); DBG.sd.push(Math.round(Math.sqrt(v / NR))); }
  // pasy = odstępy między kolejnymi granicami (krawędź, linie wewnątrz jezdni, krawędź); linia przy krawędzi zastępuje krawędź
  const inner = lines.filter(l => l.d > edges[0] - 0.5 && l.d < edges[1] + 0.5);
  const bnd = [edges[0], ...inner.map(l => l.d), edges[1]].sort((a, b) => a - b).filter((d, i, a) => !i || d - a[i - 1] > 0.8);
  const best = []; for (let i = 0; i + 1 < bnd.length; i++) best.push(+(bnd[i + 1] - bnd[i]).toFixed(2));
  const nLanes = best.filter(g => g >= 2.2).length;
  LAST = { osm_way: nw.w.i, nazwa: t.name || '', lanes_osm: t.lanes ? +t.lanes : null, lanes_wykryte: nLanes, szerokosci_pasow: best, krawedzie_jezdni: edges, linie: lines.map(({ c, ...l }) => l), punkt: [lat, lon], dlugosc_m: LEN };
  draw(bmp, { x0, y1, res, pts, k, lines, edges, IW, IH }, { strip, NR, NC, occ, asph, lines, edges, DD, HALF });
  const ok = LAST.lanes_osm == null ? '' : LAST.lanes_osm === nLanes ? ' ✓ zgodne z OSM' : ` ✗ OSM ma ${LAST.lanes_osm}`;
  $('res').innerHTML = `<div class="big">Wykryte pasy: ${nLanes}${ok}</div>` +
    `<div>Jezdnia od ${edges[0].toFixed(1)} do ${edges[1] > 0 ? '+' : ''}${edges[1].toFixed(1)} m</div><div>Szerokości: ${best.map(x => x.toFixed(2).replace('.', ',') + ' m').join(', ') || '–'}</div>` +
    `<table><tr><td><b>odsunięcie</b></td><td><b>typ</b></td><td><b>pokrycie</b></td></tr>` + lines.map(l => `<tr><td>${l.d > 0 ? '+' : ''}${l.d.toFixed(1)} m</td><td>${l.typ}</td><td>${Math.round(l.pokrycie * 100)}%</td></tr>`).join('') + `</table><small>Odsunięcie od osi OSM, + w lewo od kierunku digitalizacji.</small>`;
}

function draw(bmp, G, S) {
  const cv = $('cvO'); const f0 = Math.min(900 / G.IW, 640 / G.IH); cv.width = Math.round(G.IW * f0); cv.height = Math.round(G.IH * f0);
  const g = cv.getContext('2d'), sc = f0;
  g.clearRect(0, 0, cv.width, cv.height); g.drawImage(bmp, 0, 0, G.IW * sc, G.IH * sc);
  const s = (X, Y) => [(X - G.x0) / G.res * sc, (G.y1 - Y) / G.res * sc];
  const path = (d, col, w, dash) => { g.beginPath(); G.pts.forEach((p, i) => { const q = s(p[0] - p.ty * d / G.k, p[1] + p.tx * d / G.k); i ? g.lineTo(...q) : g.moveTo(...q); }); g.strokeStyle = col; g.lineWidth = w; g.setLineDash(dash || []); g.stroke(); g.setLineDash([]); };
  path(0, 'rgba(60,140,255,.9)', 2, [6, 4]);
  for (const d of G.edges) path(d, '#22d3ee', 2, [3, 3]);
  for (const l of G.lines) path(l.d, l.typ === 'ciągła' ? '#ffd400' : l.typ === 'przerywana' ? '#ff8a00' : '#ff3b6b', 2);
  // wyprostowany pas (stacja → x) + profil pokrycia z prawej
  const c2 = $('cvS'), h = c2.getContext('2d'), PW = 140, sx = (c2.width - PW) / S.NR, sy = c2.height / S.NC;
  const id = new ImageData(S.NR, S.NC); // transpozycja: x = wiersz, y = kolumna (góra = lewo od osi)
  for (let r = 0; r < S.NR; r++) for (let c = 0; c < S.NC; c++) { const a = (r * S.NC + (S.NC - 1 - c)) * 4, b = (c * S.NR + r) * 4; for (let e = 0; e < 4; e++) id.data[b + e] = S.strip[a + e]; }
  const tc = new OffscreenCanvas(S.NR, S.NC); tc.getContext('2d').putImageData(id, 0, 0);
  h.fillStyle = '#1b1f27'; h.fillRect(0, 0, c2.width, c2.height); h.imageSmoothingEnabled = true; h.drawImage(tc, 0, 0, c2.width - PW, c2.height);
  const yOf = d => (S.HALF - d) / S.DD * sy;
  h.strokeStyle = 'rgba(60,140,255,.9)'; h.setLineDash([6, 4]); h.beginPath(); h.moveTo(0, yOf(0)); h.lineTo(c2.width - PW, yOf(0)); h.stroke(); h.setLineDash([]);
  h.fillStyle = '#7dd3fc'; for (let c = 0; c < S.NC; c++) h.fillRect(c2.width - PW, (S.NC - 1 - c) * sy, S.occ[c] * PW, Math.max(1, sy));
  h.fillStyle = 'rgba(160,160,160,.5)'; for (let c = 0; c < S.NC; c++) h.fillRect(c2.width - PW, (S.NC - 1 - c) * sy, S.asph[c] * PW * 0.5, Math.max(1, sy));
  h.strokeStyle = '#22d3ee'; h.setLineDash([3, 3]); for (const d of S.edges) { h.beginPath(); h.moveTo(0, yOf(d)); h.lineTo(c2.width - PW, yOf(d)); h.stroke(); } h.setLineDash([]);
  h.font = '11px system-ui';
  for (const l of S.lines) { const y = yOf(l.d); h.fillStyle = l.typ === 'ciągła' ? '#ffd400' : l.typ === 'przerywana' ? '#ff8a00' : '#ff3b6b'; h.fillRect(c2.width - PW - 6, y - 1, 6, 2); h.fillText(`${l.d > 0 ? '+' : ''}${l.d.toFixed(1)}`, c2.width - 34, y - 3); }
  G.toLL = (cx, cy) => toLL(G.x0 + cx / sc * G.res, G.y1 - cy / sc * G.res);
  cv.onclick = e => { const b = cv.getBoundingClientRect(), ll = G.toLL((e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height); $('lat').value = ll[1].toFixed(7); $('lon').value = ll[0].toFixed(7); run(); };
}

$('go').onclick = () => run().catch(e => log('Błąd: ' + e.message));
$('exp').onclick = () => { if (!LAST) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(LAST, null, 1)], { type: 'application/json' })); a.download = `pasy-${LAST.osm_way}.json`; a.click(); };
const qp = new URLSearchParams(location.search); if (qp.get('lat')) { $('lat').value = qp.get('lat'); $('lon').value = qp.get('lon'); }
run().catch(e => log('Błąd: ' + e.message));
</script>
</body>
</html>
