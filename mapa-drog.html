<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mapa dróg</title>
<style>
  :root { --bg:#e9ecdf; --pn:#fff; --tx:#1d2330; --mu:#667085; --ac:#1e88e5; }
  @media (prefers-color-scheme: dark) { :root { --pn:#1b212b; --tx:#e6e9ef; --mu:#97a1b3; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tx); overscroll-behavior:none; }
  #map { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #map:active { cursor:grabbing; }
  .box { position:fixed; background:var(--pn); border-radius:8px; box-shadow:0 1px 6px rgba(0,0,0,.3); padding:6px 9px; }
  #hud { left:10px; top:10px; max-width:240px; }
  #hud b { font-size:14px; } #hud .s { color:var(--mu); font-size:11px; margin-top:2px; }
  #hud label { display:flex; gap:5px; align-items:center; margin-top:3px; }
  #tags { left:10px; bottom:10px; max-width:300px; max-height:40vh; overflow:auto; font:11px/1.35 ui-monospace,Menlo,Consolas,monospace; display:none; }
  #tags .k { color:var(--mu); }
  #attr { right:6px; bottom:4px; font-size:10px; padding:1px 6px; border-radius:4px; color:var(--mu); }
  #zbtn { right:10px; top:10px; display:flex; flex-direction:column; gap:4px; padding:4px; }
  #zbtn button { width:30px; height:30px; font-size:18px; border:1px solid #ccd; background:var(--pn); color:var(--tx); border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="hud" class="box"><b>Mapa dróg</b><div class="s" id="st">wczytuję…</div>
  <label><input type="checkbox" id="cArr" checked> strzałki (turn:lanes)</label>
  <label><input type="checkbox" id="cLn" checked> linie pasów</label>
  <label><input type="checkbox" id="cBr" checked> mosty (cień, barierki)</label></div>
<div id="zbtn" class="box"><button id="zi" title="Przybliż">+</button><button id="zo" title="Oddal">−</button></div>
<div id="tags" class="box"></div>
<div id="attr" class="box">Dane © współtwórcy OpenStreetMap (ODbL)</div>
<script>
'use strict';
/* =====================================================================
   MAPA DRÓG – lekki silnik od zera.
   Rurociąg:  kafelki (dane Gdyni z repo) -> graf (węzły/krawędzie)
              -> model pasów -> trasy (przelotowe pary ramion w węźle)
              -> dopasowanie położenia jezdni na węzłach -> geometria (Path2D w metrach)
              -> rysowanie jedną transformacją (bez przeliczania przy przesuwaniu).
   ===================================================================== */

/* ---------- konfiguracja (wszystkie progi w jednym miejscu) ---------- */
const CFG = {
  tile: { dLon: 0.02, dLat: 0.01, url: (x, y) => `data/roads/gdynia/${x}_${y}.json` },
  zoom: { kMin: 0.0014, kMax: 300, loadK: 0.5, maxWays: 2500 },
  through: { maxDev: 0.65, nameBonus: 2, classBonus: 1, lanesBonus: 0.5 },   // rad (~37°)
  taper: { max: 22, frac: 0.4 },
  junction: { cutMin: 2, cutMax: 9, filletMaxFactor: 3, straightAbove: 2.6 }, // rad: powyżej kąta (≈150°) bez łuku
  chaikin: 2,
  line: { edge: 0.2, lane: 0.14, dash: [3, 9] },
  colors: { asphalt: '#6b6e74', edge: '#e6e7e3', lane: '#eeeeee', center: '#f0d44a', bridge: '#8d9197' },
};
/* klasy dróg: szerokość pasa, ranga, oznakowanie */
const HW = {
  motorway:     { w: 3.75, rank: 9, marks: 1, edge: 1, def: 2 }, trunk:        { w: 3.6,  rank: 8.5, marks: 1, edge: 1, def: 2 },
  primary:      { w: 3.5,  rank: 8, marks: 1, edge: 1, def: 1 }, secondary:    { w: 3.4,  rank: 7, marks: 1, edge: 1, def: 1 },
  tertiary:     { w: 3.25, rank: 6, marks: 1, edge: 1, def: 1 }, unclassified: { w: 3.0,  rank: 5, marks: 1, edge: 0, def: 1 },
  residential:  { w: 2.75, rank: 4, marks: 0, edge: 0, def: 1 }, living_street:{ w: 2.5,  rank: 3, marks: 0, edge: 0, def: 1 },
  service:      { w: 2.5,  rank: 2, marks: 0, edge: 0, def: 1 }, road:         { w: 3.0,  rank: 3, marks: 0, edge: 0, def: 1 },
};
const hwInfo = h => HW[(h || '').replace('_link', '')] || null;

/* ---------- rzut i widok ---------- */
const LON0 = 18.5345, LAT0 = 54.5073, MX = 111320 * Math.cos(LAT0 * Math.PI / 180), MY = 110540;
const proj = (lon, lat) => [(lon - LON0) * MX, -(lat - LAT0) * MY];
const unproj = (x, y) => [LON0 + x / MX, LAT0 - y / MY];
const cv = document.getElementById('map'), ctx = cv.getContext('2d');
const V = { x: 0, y: 0, k: 1.4 }; let W = 0, H = 0, DPR = 1, dirty = true;
const zoomOf = k => Math.log2(156543.03 * Math.cos(LAT0 * Math.PI / 180) * k), kOfZoom = z => Math.pow(2, z) / (156543.03 * Math.cos(LAT0 * Math.PI / 180));
const s2w = (sx, sy) => [(sx - W / 2) / V.k + V.x, (sy - H / 2) / V.k + V.y];
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); dirty = true; }
addEventListener('resize', resize);

/* ---------- dane: kafelki z repo ---------- */
const tiles = new Map(), ways = new Map(); let pending = 0, graphTimer = 0;
const tileRange = () => { const a = unproj(...s2w(-W * 0.3, -H * 0.3)), b = unproj(...s2w(W * 1.3, H * 1.3)); return { x0: Math.floor(Math.min(a[0], b[0]) / CFG.tile.dLon), x1: Math.floor(Math.max(a[0], b[0]) / CFG.tile.dLon), y0: Math.floor(Math.min(a[1], b[1]) / CFG.tile.dLat), y1: Math.floor(Math.max(a[1], b[1]) / CFG.tile.dLat) }; };
async function loadTile(x, y) {
  const key = x + '_' + y; if (tiles.has(key)) return; tiles.set(key, 0); pending++;
  try { const r = await fetch(CFG.tile.url(x, y)); if (r.ok) for (const w of await r.json()) if (!ways.has(w.i)) ways.set(w.i, { id: w.i, t: w.t, g: w.g.map(c => proj(c[0], c[1])), k: w.g.map(c => c[0].toFixed(7) + ',' + c[1].toFixed(7)) }); tiles.set(key, 1); }
  catch (e) { tiles.delete(key); } finally { pending--; scheduleGraph(); }
}
function ensureTiles() { if (V.k < CFG.zoom.loadK) return; const r = tileRange(); for (let x = r.x0; x <= r.x1; x++) for (let y = r.y0; y <= r.y1; y++) if (!tiles.has(x + '_' + y) && pending < 4) loadTile(x, y); }
function scheduleGraph() { clearTimeout(graphTimer); graphTimer = setTimeout(rebuild, 120); }

/* ---------- 1) graf: węzły i krawędzie ---------- */
function buildGraph(list) {
  const use = new Map(); for (const w of list) { const seen = new Set(); w.k.forEach((k, i) => { if (!seen.has(k)) { seen.add(k); use.set(k, (use.get(k) || 0) + 1); } if (i === 0 || i === w.k.length - 1) use.set(k, (use.get(k) || 0) + 1); }); }
  const nodes = new Map(), edges = [];
  const node = (k, p) => { let n = nodes.get(k); if (!n) nodes.set(k, n = { k, x: p[0], y: p[1], arms: [] }); return n; };
  for (const w of list) {
    const hw = w.t.highway; if (!hwInfo(hw) || w.t.area === 'yes') continue;
    let cut = [0]; for (let i = 1; i < w.k.length - 1; i++) if (use.get(w.k[i]) > 1) cut.push(i); cut.push(w.k.length - 1);
    for (let c = 0; c + 1 < cut.length; c++) {
      let pts = w.g.slice(cut[c], cut[c + 1] + 1), ka = w.k[cut[c]], kb = w.k[cut[c + 1]]; if (pts.length < 2 || ka === kb && pts.length < 3) continue;
      if (w.t.oneway === '-1') { pts = pts.slice().reverse(); [ka, kb] = [kb, ka]; }
      const e = { id: w.id + ':' + c, way: w.id, t: w.t, hw, info: hwInfo(hw), raw: pts, a: ka, b: kb, ly: layerOf(w.t) };
      e.na = node(ka, pts[0]); e.nb = node(kb, pts[pts.length - 1]); edges.push(e);

}
function layerOf(t) { let l = parseInt(t.layer, 10) || 0; if (t.bridge && t.bridge !== 'no' && l < 1) l = 1; if (t.tunnel && t.tunnel !== 'no' && l > -1) l = -1; return l; }

/* ---------- 2) model pasów krawędzi ---------- */
const tokens = (s, n) => { const a = (s || '').split('|').map(x => x.replace(/slight_|sharp_/g, '')); while (a.length < n) a.push(''); return a.slice(0, n); };

  if (ow) {

    if (tw > 0) w = Math.max(2.2, Math.min(5, tw / n));
    const thr = lanes.map((l, i) => /through|^$|none/.test(l.tok) ? i : -1).filter(i => i >= 0);
    const turnish = lanes.some(l => l.tok && !/^(through|none)$/.test(l.tok)); e.anchor = turnish && thr.length && thr.length < n ? (thr[0] + thr[thr.length - 1] + 1) / 2 : n / 2; /* oś: środek pasów „na wprost” */
  } else {
    let nf = parseInt(t['lanes:forward'], 10), nb = parseInt(t['lanes:backward'], 10);
    if (!(total > 0)) total = (nf >= 0 ? nf : 0) + (nb >= 0 ? nb : 0) || (info.marks ? 2 : (info.rank >= 4 ? 2 : 1));
    if (!(nf >= 0) && !(nb >= 0)) { nf = Math.ceil(total / 2); nb = total - nf; } else if (!(nf >= 0)) nf = total - nb; else if (!(nb >= 0)) nb = total - nf;
    if (total === 1 && nf + nb !== 1) { nf = 1; nb = 0; }
    const tf = tokens(t['turn:lanes:forward'], nf), tb = tokens(t['turn:lanes:backward'], nb);
    for (let j = nb - 1; j >= 0; j--) lanes.push({ dir: -1, tok: tb[j] }); for (let j = 0; j < nf; j++) lanes.push({ dir: 1, tok: tf[j] });
    if (tw > 0 && lanes.length) w = Math.max(2.2, Math.min(5, tw / lanes.length));
    e.anchor = nf && nb ? nb : lanes.length / 2; /* oś w linii środkowej między kierunkami */
  }
  e.lanes = lanes; e.lw = w; e.oneway = ow;
  const n = lanes.length; e.oL = -e.anchor * w; e.oR = (n - e.anchor) * w;
}

/* ---------- 3) trasy: pary przelotowe w węźle + dopasowanie położenia ---------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], nrm = a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
function smoothLine(pts, it) { let P = pts; for (let r = 0; r < it; r++) { if (P.length < 3) break; const Q = [P[0]]; for (let i = 0; i < P.length - 1; i++) { const a = P[i], b = P[i + 1]; Q.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); } Q.push(P[P.length - 1]); P = Q; } return P; }
function prepEdge(e) {
  e.pts = smoothLine(e.raw, CFG.chaikin); const c = [0]; for (let i = 1; i < e.pts.length; i++) c.push(c[i - 1] + Math.hypot(e.pts[i][0] - e.pts[i - 1][0], e.pts[i][1] - e.pts[i - 1][1])); e.cum = c; e.len = c[c.length - 1];
  laneModel(e); e.offA = [e.oL, e.oR]; e.offB = [e.oL, e.oR];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of e.pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); } const m = Math.max(Math.abs(e.oL), Math.abs(e.oR)) + 3; e.bb = [x0 - m, y0 - m, x1 + m, y1 + m];
}
function outward(e, end) { const P = e.pts, n = P.length; if (end === 'a') { const q = atS(e, Math.min(6, e.len * 0.6)); return nrm(sub(q, P[0])); } const q = atS(e, Math.max(e.len - 6, e.len * 0.4)); return nrm(sub(q, P[n - 1])); }
function atS(e, s) { const c = e.cum, P = e.pts; if (s <= 0) return P[0]; if (s >= e.len) return P[P.length - 1]; let i = 1; while (i < c.length - 1 && c[i] < s) i++; const f = (s - c[i - 1]) / ((c[i] - c[i - 1]) || 1); return [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f]; }

function matchNodes(G) {
  for (const n of G.nodes.values()) n.arms = [];
  for (const e of G.edges) { e.na.arms.push({ e, end: 'a' }); e.nb.arms.push({ e, end: 'b' }); }
  for (const n of G.nodes.values()) {
    const arms = n.arms; if (arms.length < 2) continue;
    for (const a of arms) { a.d = outward(a.e, a.end); a.ang = Math.atan2(a.d[1], a.d[0]); a.off = a.end === 'a' ? a.e.offA : a.e.offB; }
    const cand = []; for (let i = 0; i < arms.length; i++) for (let j = i + 1; j < arms.length; j++) { const A = arms[i], B = arms[j], dev = Math.PI - Math.acos(Math.max(-1, Math.min(1, A.d[0] * B.d[0] + A.d[1] * B.d[1]))); if (dev > CFG.through.maxDev) continue;
      const same = (A.e.t.name && A.e.t.name === B.e.t.name) || (A.e.t.ref && A.e.t.ref === B.e.t.ref); cand.push({ A, B, sc: (same ? CFG.through.nameBonus : 0) + (Math.floor(A.e.info.rank) === Math.floor(B.e.info.rank) ? CFG.through.classBonus : 0) + (A.e.lanes.length === B.e.lanes.length ? CFG.through.lanesBonus : 0) - dev * 2 }); }
    cand.sort((p, q) => q.sc - p.sc); const used = new Set(); n.pairs = [];
    for (const c of cand) { if (used.has(c.A) || used.has(c.B)) continue; used.add(c.A); used.add(c.B); n.pairs.push(c);
      /* ramię w układzie trasy: początek krawędzi = kierunek przeciwny do trasy => odbicie lewo/prawo */
      const fr = (arm, route) => (arm.end === 'a') === route ? [-arm.off[1], -arm.off[0]] : [arm.off[0], arm.off[1]]; /* route=true dla ramienia A (trasa wchodzi) */
      const a = fr(c.A, true), b = fr(c.B, false), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const back = (arm, route) => (arm.end === 'a') === route ? [-m[1], -m[0]] : [m[0], m[1]]; const va = back(c.A, true), vb = back(c.B, false);
      if (c.A.end === 'a') c.A.e.offA = va; else c.A.e.offB = va; if (c.B.end === 'a') c.B.e.offA = vb; else c.B.e.offB = vb; c.A.off = va; c.B.off = vb; }

  }
}

/* ---------- 4) geometria krawędzi i węzłów (Path2D w metrach) ---------- */
function inStrip(e, p, pad) { /* czy punkt leży wewnątrz asfaltu krawędzi e (na jej szerokości); pad > 0 zwęża pas */

  for (let i = 1; i < P.length; i++) { const A = P[i - 1], B = P[i], dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((p[0] - A[0]) * dx + (p[1] - A[1]) * dy) / L2)), qx = A[0] + dx * t, qy = A[1] + dy * t, d = Math.hypot(p[0] - qx, p[1] - qy); if (d < bd) { bd = d; bs = e.cum[i - 1] + (e.cum[i] - e.cum[i - 1]) * t; const L = Math.sqrt(L2); bn = ((p[0] - qx) * -dy + (p[1] - qy) * dx) / L; } }

  const out = []; for (const o of G.edges) { if (o === e || o.ly !== e.ly) continue; if (o.bb[2] < e.bb[0] || o.bb[0] > e.bb[2] || o.bb[3] < e.bb[1] || o.bb[1] > e.bb[3]) continue;
    let partner = false; for (const n of [e.na, e.nb]) for (const c of n.pairs || []) if ((c.A.e === e && c.B.e === o) || (c.B.e === e && c.A.e === o)) partner = true; if (!partner) out.push(o); } return out; }

function lat(e, s) { /* położenie lewej i prawej krawędzi na długości s (zwężenie przy końcach do wartości z węzła) */
  const T = Math.min(CFG.taper.max, e.len * CFG.taper.frac), wa = 1 - sm(Math.max(0, Math.min(1, s / T))), wb = 1 - sm(Math.max(0, Math.min(1, (e.len - s) / T)));

function buildEdgeGeo(e) {
  const P = e.pts, n = P.length, L = [], R = [], N = [], S = e.cum, cutA = e.na.arms.length >= 3 ? (e.na.cut || 0) : 0, cutB = e.nb.arms.length >= 3 ? (e.nb.cut || 0) : 0;
  const T = []; for (let i = 0; i < n; i++) { const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)], d = nrm(sub(b, a)); T.push(d); N.push([-d[1], d[0]]); }

  for (const q of dense) { const l = lat(e, q.s); q.l = [q.p[0] + q.nn[0] * l[0], q.p[1] + q.nn[1] * l[0]]; q.r = [q.p[0] + q.nn[0] * l[1], q.p[1] + q.nn[1] * l[1]]; q.lo = l; }
  const asphalt = new Path2D(); asphalt.moveTo(dense[0].l[0], dense[0].l[1]); for (const q of dense) asphalt.lineTo(q.l[0], q.l[1]); for (let i = dense.length - 1; i >= 0; i--) asphalt.lineTo(dense[i].r[0], dense[i].r[1]); asphalt.closePath();
  const info = e.info, nL = e.lanes.length, edge = new Path2D(), dash = new Path2D(), solid = new Path2D(), dbl = new Path2D(), bridge = new Path2D();
  const nb2 = e.info.edge ? neighbors(e) : [], covered = pt => nb2.some(o => inStrip(o, pt, 0.15)), inside = q => q.s >= cutA && q.s <= e.len - cutB, line = (path, f, chk) => { let on = false; for (const q of dense) { const ok = inside(q); if (!ok) { on = false; continue; } const pt = f(q); if (chk && covered(pt)) { on = false; continue; } if (!on) { path.moveTo(pt[0], pt[1]); on = true; } else path.lineTo(pt[0], pt[1]); } };
  if (info.edge) { line(edge, q => q.l, true); line(edge, q => q.r, true); }

/* ---------- 6) rysowanie ---------- */
let asphaltPat = null;

function arrowPath(ctx2, tok) { /* strzałka w kierunku +x, długość ~3 m */
  const one = (sx, kind) => { ctx2.beginPath();

function draw() {
