    g.beginPath(); g.roundRect ? g.roundRect(1, 1, 32, 14, 2.5) : g.rect(1, 1, 32, 14); g.fill(); g.stroke();
    // rower „stoi” w kierunku jazdy (jak malowany znak oglądany z jezdni): obrót o 90°
    g.save(); g.translate(11, 8); g.rotate(Math.PI / 2); drawBike(g, 0, 0.3, 12.5, '#fff'); g.restore();
    g.strokeStyle = '#fff'; g.lineWidth = 1.6;
    for (const x of [21, 26]) { g.beginPath(); g.moveTo(x, 3.5); g.lineTo(x + 3.5, 8); g.lineTo(x, 12.5); g.stroke(); }
  }),
  c13: canvasIcon(22, 22, (g) => {
    g.beginPath(); g.arc(11, 11, 10, 0, 7); g.fillStyle = SIGN_BLUE; g.fill(); g.lineWidth = 1.5; g.strokeStyle = '#fff'; g.stroke();
    drawBike(g, 11, 11.5, 14, '#fff');
  }),
  c13c16: canvasIcon(22, 22, (g) => {
    g.beginPath(); g.arc(11, 11, 10, 0, 7); g.fillStyle = SIGN_BLUE; g.fill(); g.lineWidth = 1.5; g.strokeStyle = '#fff'; g.stroke();
    g.beginPath(); g.moveTo(2.5, 11); g.lineTo(19.5, 11); g.lineWidth = 1.2; g.stroke();
    drawWalker(g, 11, 6.8, 7, '#fff'); drawBike(g, 11, 15.2, 10, '#fff');
  }),
  // malowany symbol roweru ze strzałką (jak na jezdni), patrzy w prawo = w kierunku linii
  // pas rowerowy (P-23): etykieta jak sierżant, ale na niebieskim tle – rower i strzałka w kierunku jazdy
  lanebike: canvasIcon(34, 16, (g) => {
    g.fillStyle = '#2f6fae'; g.strokeStyle = '#fff'; g.lineWidth = 1;
    g.beginPath(); g.roundRect ? g.roundRect(1, 1, 32, 14, 2.5) : g.rect(1, 1, 32, 14); g.fill(); g.stroke();
    g.save(); g.translate(11, 8); g.rotate(Math.PI / 2); drawBike(g, 0, 0.3, 12.5, '#fff'); g.restore();
    g.strokeStyle = '#fff'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(19.5, 8); g.lineTo(27, 8); g.stroke();
    g.beginPath(); g.moveTo(30.5, 8); g.lineTo(25.5, 4.5); g.lineTo(25.5, 11.5); g.closePath(); g.fillStyle = '#fff'; g.fill();
  }),
};
function addInfraImages() {
  for (const [name, c] of Object.entries(ICONS)) if (!map.hasImage(name))
    map.addImage(name, c.getContext('2d').getImageData(0, 0, c.width, c.height), { pixelRatio: PR });
}

// --- legenda infrastruktury ---
(function () {
  const img = (n, h = 14) => `<img src="${ICONS[n].toDataURL()}" height="${h}" alt="">`;
  const line = (i, extra = '') => {
    const dash = i.dash ? `stroke-dasharray="${i.dash.map(v => v * i.width * 1.6).join(' ')}"` : '';
    const cas = i.casing ? `<line x1="2" y1="6" x2="32" y2="6" stroke="#c3c9d1" stroke-width="${i.width * 1.2 + 3}" stroke-linecap="round"/>` : '';
    return `<svg width="34" height="12" style="flex:none">${cas}<line x1="2" y1="6" x2="32" y2="6" stroke="${i.color}" stroke-width="${i.width * 1.2}" ${dash} stroke-linecap="${i.dash ? 'butt' : 'round'}"/></svg>${extra}`;
  };
  const crossing = `<svg width="34" height="12" style="flex:none"><rect x="2" y="0" width="30" height="12" fill="#d7262b"/><line x1="2" y1="1.5" x2="32" y2="1.5" stroke="#fff" stroke-width="2.4" stroke-dasharray="2.4 2.4"/><line x1="2" y1="10.5" x2="32" y2="10.5" stroke="#fff" stroke-width="2.4" stroke-dasharray="2.4 2.4"/></svg>`;
  const extra = { droga: img('c13'), ciag: img('c13c16'), pas: img('lanebike', 12), kontrapas: img('lanebike', 12), kontraruch: img('arrow2', 10), sharrow: img('sharrowsign', 12) };
  document.getElementById('legend-infra').innerHTML = Object.entries(INFRA).map(([k, i]) =>
    `<div class="legend-row">${k === 'przejazd' ? crossing : line(i)}${extra[k] || ''}<span>${esc(i.label)}</span></div>`).join('') +
    `<div class="legend-row"><span style="width:34px;text-align:center;flex:none">${img('arrow', 10)}</span><span>Kierunek jazdy, gdzie tylko w jedną stronę</span></div>`;
})();
// legenda szlaków (dodana pod checkboxami)
(function () {
  const svgDots = c => `<svg width="34" height="8"><line x1="3" y1="4" x2="33" y2="4" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 7"/></svg>`;
  const svgDash = c => `<svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="${c}" stroke-width="3" stroke-dasharray="8 4"/></svg>`;
  document.getElementById('lyr-bicycle').parentElement.insertAdjacentHTML('afterend',
    `<div class="legend-row">${svgDots(PTTK.red)}${svgDots(PTTK.blue)}</div>`);
  document.getElementById('lyr-hiking').parentElement.insertAdjacentHTML('afterend',
    `<div class="legend-row">${svgDash(PTTK.red)}${svgDash(PTTK.green)}</div>`);
})();

setInterval(() => { if (queue.length || running) renderStatus(); }, 1000); // licznik sekund przy ładowaniu
function renderStatus() {
  const all = [...tiles.values()];
  const loading = all.filter(t => t.status === 'loading' || t.status === 'queued').length;
  const errors = all.filter(t => t.status === 'error');
  const bases = all.map(t => t.osmBase).filter(Boolean).sort();
  const fmt = iso => new Date(iso).toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'medium' });
  let s = '';
  if (stats) s += `<b>${stats.bicycle}</b> szlaków rowerowych · <b>${stats.hiking}</b> pieszych<br><b>${stats.infraKm.toFixed(0)} km</b> dróg z infrastrukturą rowerową<br>`;
  if (bases.length) s += `Stan bazy OSM: <b>${fmt(bases[0])}</b>${all.some(t => t.fromCache === 'snapshot') ? ' (kopia z serwera mapy)' : all.some(t => t.fromCache) ? ' (z pamięci przeglądarki)' : ''}<br>`;
  const active = all.filter(t => t.status === 'loading');
  if (loading) {
    const t = active[0], secs = t ? Math.round((Date.now() - t.startedAt) / 1000) : 0, a = t && t.attemptInfo;
    s += `<span class="busy">${stats ? 'Odświeżanie' : 'Pobieranie'} danych z Overpass… <b>${secs} s</b>`;
    if (a) s += `<br>serwer: ${esc(a.server)}${a.attempt > 1 ? `, próba ${a.attempt}` : ''}`;
    if (a && a.lastErr) s += `<br><span style="color:#c60">poprzednia próba: ${esc(String(a.lastErr.message || a.lastErr).replace(/^https?:\/\/[^ ]+ → /, ''))}</span>`;
    if (secs > 15) s += `<br>Publiczne serwery Overpass bywają przeciążone, pierwsze ładowanie może potrwać do 1–2 min.${stats ? ' Do tego czasu widać poprzednie dane.' : ''}`;
    s += '</span><br>';
  }
  if (errors.length) s += `<span style="color:#d33">Nie udało się pobrać danych: ${esc(errors[0].error || '')}. Kolejna próba za chwilę automatycznie albo kliknij „Odśwież teraz”.</span><br>`;
  if (!REGION.preload && map.getZoom() < MIN_DATA_ZOOM) s += `Przybliż mapę (zoom ≥ ${MIN_DATA_ZOOM}), aby wczytać szlaki.<br>`;
  s += `Auto-odświeżanie co ${REFRESH_MS / 60000} min.`;
  document.getElementById('status').innerHTML = s;
}
</script>
