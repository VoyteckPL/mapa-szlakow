<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Szlaków</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root {
  --bg: #ffffff; --fg: #1d2125; --muted: #5f6b76; --line: #dde2e7; --panel: rgba(255,255,255,.96);
  --accent: #0b6bcb; --shadow: 0 2px 12px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181b; --fg: #e8ecef; --muted: #9aa6b1; --line: #2c3238; --panel: rgba(24,27,31,.96);
    --accent: #5aa9ff; --shadow: 0 2px 12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #15181b; --fg: #e8ecef; --muted: #9aa6b1; --line: #2c3238; --panel: rgba(24,27,31,.96);
  --accent: #5aa9ff; --shadow: 0 2px 12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#map { position: absolute; inset: 0; }

/* --- minimalny CSS MapLibre (bez zewnętrznego arkusza) --- */
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-top-left
  { position: absolute; pointer-events: none; z-index: 2; }
.maplibregl-ctrl-top-right { top: 0; right: 0; } .maplibregl-ctrl-bottom-right { bottom: 0; right: 0; }
.maplibregl-ctrl-bottom-left { bottom: 0; left: 0; } .maplibregl-ctrl-top-left { top: 0; left: 0; }
.maplibregl-ctrl { pointer-events: auto; clear: both; }
.maplibregl-ctrl-top-right .maplibregl-ctrl { float: right; margin: 10px 10px 0 0; }
.maplibregl-ctrl-bottom-right .maplibregl-ctrl { float: right; margin: 0 10px 10px 0; }
.maplibregl-ctrl-bottom-left .maplibregl-ctrl { float: left; margin: 0 0 10px 10px; }
.maplibregl-ctrl-group { background: #fff; border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
.maplibregl-ctrl-group button { width: 32px; height: 32px; display: block; border: 0; background: transparent; cursor: pointer; padding: 0; }
.maplibregl-ctrl-group button + button { border-top: 1px solid #ddd; }
.maplibregl-ctrl-group button:hover { background: #f0f0f0; }
.maplibregl-ctrl-icon { display: block; width: 100%; height: 100%; background-repeat: no-repeat; background-position: center; }
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Cpath d='M14.5 8.5c-.75 0-1.5.75-1.5 1.5v3h-3c-.75 0-1.5.75-1.5 1.5S9.25 16 10 16h3v3c0 .75.75 1.5 1.5 1.5S16 19.75 16 19v-3h3c.75 0 1.5-.75 1.5-1.5S19.75 13 19 13h-3v-3c0-.75-.75-1.5-1.5-1.5z' fill='%23333'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Cpath d='M10 13c-.75 0-1.5.75-1.5 1.5S9.25 16 10 16h9c.75 0 1.5-.75 1.5-1.5S19.75 13 19 13h-9z' fill='%23333'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-compass .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Cpath d='m10.5 14 4-8 4 8h-8z' fill='%23d33'/%3E%3Cpath d='m10.5 16 4 8 4-8h-8z' fill='%23999'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-geolocate .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Ccircle cx='14.5' cy='14.5' r='4' fill='none' stroke='%23333' stroke-width='2'/%3E%3Cpath d='M14.5 6v4M14.5 19v4M6 14.5h4M19 14.5h4' stroke='%23333' stroke-width='2'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-attrib { background: rgba(255,255,255,.8); padding: 2px 6px; font-size: 11px; color: #333; border-radius: 4px 0 0 0; margin: 0 !important; }
.maplibregl-ctrl-attrib a { color: #333; }
.maplibregl-ctrl-attrib-button { display: none; }
.maplibregl-ctrl-scale { background: rgba(255,255,255,.8); border: 2px solid #333; border-top: 0; font-size: 10px; padding: 0 5px; color: #333; }
.maplibregl-user-location-dot { width: 14px; height: 14px; border-radius: 50%; background: #1da1f2; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.4); }
.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }

/* --- panel boczny --- */
.panel { position: absolute; z-index: 5; background: var(--panel); color: var(--fg); box-shadow: var(--shadow); border-radius: 10px; }
#controls { top: 10px; left: 10px; width: 270px; max-height: calc(100% - 20px); overflow: auto; padding: 12px 14px; }
#controls h1 { font-size: 16px; margin: 0 0 2px; }
#controls .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
#controls h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; }
#controls label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
#controls input[type=range] { width: 100%; }
.swatch { width: 34px; height: 10px; flex: none; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 2px 0 2px 22px; }
#status { font-size: 12px; color: var(--muted); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
#status b { color: var(--fg); font-weight: 600; }
button.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-top: 6px; }
button.btn:hover { border-color: var(--accent); }
#toggle-controls { display: none; }

#info { top: 10px; right: 54px; width: 360px; max-height: calc(100% - 60px); overflow: auto; padding: 12px 14px; display: none; }
#info.open { display: block; }
#info .close { position: sticky; top: 0; float: right; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
.route-card { border-top: 1px solid var(--line); padding: 10px 0 6px; }
.route-card:first-of-type { border-top: 0; padding-top: 0; }
.route-card h3 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.route-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.route-card .links a { color: var(--accent); font-size: 12.5px; margin-right: 10px; }
.chip { display: inline-block; width: 22px; height: 6px; border-radius: 3px; flex: none; }
table.tags { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
table.tags td { padding: 2px 4px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
table.tags td:first-child { color: var(--muted); width: 40%; font-family: ui-monospace, Menlo, Consolas, monospace; }
details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 4px; }

@media (max-width: 640px) {
  #controls { width: auto; right: 10px; max-height: 55%; }
  #controls.collapsed > :not(.head) { display: none; }
  #toggle-controls { display: inline-block; }
  #info { left: 10px; right: 10px; top: auto; bottom: 26px; width: auto; max-height: 50%; }
}
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <div class="head">
    <h1>Mapa Szlaków <button class="btn" id="toggle-controls" style="float:right;margin:0">Warstwy</button></h1>
    <div class="sub" id="region-name">Prototyp</div>
  </div>

  <h2>Podkład</h2>
  <div id="basemaps"></div>

  <h2>Nakładki</h2>
  <label><input type="checkbox" id="hillshade" checked> Cieniowanie ISOK (Geoportal)</label>
  <input type="range" id="hillshade-opacity" min="0" max="100" value="35" aria-label="Przezroczystość cieniowania">

  <h2>Szlaki (relacje OSM)</h2>
  <label><input type="checkbox" id="lyr-bicycle" checked> Rowerowe <span style="color:var(--muted)">(kropki)</span></label>
  <label><input type="checkbox" id="lyr-hiking" checked> Piesze <span style="color:var(--muted)">(kreski)</span></label>

  <h2>Infrastruktura rowerowa</h2>
  <label><input type="checkbox" id="lyr-infra" checked> Pokaż</label>
  <div id="legend-infra"></div>

  <div id="status">Ładowanie danych…</div>
  <button class="btn" id="refresh">Odśwież teraz</button>
</div>

<div id="info" class="panel" role="dialog" aria-label="Dane szlaku"></div>

<script>
'use strict';

/* =========================================================================
   KONFIGURACJA
   Region jest tylko prostokątem + flagą, czy ładować całość od razu.
   Rozszerzenie na Polskę: ?region=polska (dociąga kafle widoku od zoom 10).
   ========================================================================= */
const REGIONS = {
  gdynia: { name: 'Gdynia', bbox: [54.42, 18.36, 54.61, 18.60], center: [18.49, 54.51], zoom: 12, preload: true },
  trojmiasto: { name: 'Trójmiasto', bbox: [54.27, 18.33, 54.62, 18.80], center: [18.57, 54.43], zoom: 11, preload: false },
  polska: { name: 'Polska', bbox: [49.0, 14.1, 54.9, 24.2], center: [19.4, 52.0], zoom: 6, preload: false },
};
const params = new URLSearchParams(location.search);
const REGION = REGIONS[params.get('region')] || REGIONS.gdynia;

const TILE_Z = 10;               // siatka kafli zapytań Overpass (z10 ≈ 25×40 km)
const MIN_DATA_ZOOM = 10;        // poniżej nie dociągamy danych (dla dużych regionów)
const REFRESH_MS = 5 * 60 * 1000; // co ile odświeżać widoczne kafle
const MAX_PARALLEL = 2;          // grzeczność wobec publicznego Overpass
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
];

/* --- podkłady --- */
// WMS Geoportalu przez protokół „retry://”: limit równoległych żądań + ponawianie przy 503
// (serwer GUGiK odrzuca zbyt wiele jednoczesnych zapytań). Kafle 512 px = 4× mniej żądań.
const wms = (url, layer, extra = '') =>
  `retry://${url}?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=${layer}&STYLES=&FORMAT=image/png&TRANSPARENT=TRUE&CRS=EPSG:3857&WIDTH=512&HEIGHT=512&BBOX={bbox-epsg-3857}${extra}`;
const RETRY_PARALLEL = 4; let retryActive = 0; const retryWaiting = [];
const retrySlot = () => new Promise(res => retryActive < RETRY_PARALLEL ? (retryActive++, res()) : retryWaiting.push(res));
const retryFree = () => { const n = retryWaiting.shift(); n ? n() : retryActive--; };
maplibregl.addProtocol('retry', async (params, abortController) => {
  const url = params.url.replace(/^retry:\/\//, '');
  await retrySlot();
  try {
    for (let i = 0; ; i++) {
      if (abortController.signal.aborted) throw new Error('aborted');
      const res = await fetch(url, { signal: abortController.signal });
      if (res.ok) return { data: await res.arrayBuffer() };
      if (i >= 4 || ![429, 500, 502, 503, 504].includes(res.status)) throw new Error(`HTTP ${res.status}`);
      await new Promise(r => setTimeout(r, 400 * 2 ** i + Math.random() * 300));
    }
  } finally { retryFree(); }
});

// Serwery tile.openstreetmap.org blokują strony otwierane z dysku (file://, brak nagłówka Referer).
// Wtedy domyślnym podkładem jest CARTO Voyager (też rysowany z danych OSM).
const FROM_FILE = location.protocol === 'file:';
const BASEMAPS = [
  { id: 'osm', name: FROM_FILE ? 'OpenStreetMap (nie działa z pliku)' : 'OpenStreetMap', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], max: 19,
    attr: '© <a href="https://www.openstreetmap.org/copyright">autorzy OpenStreetMap</a>' },
  { id: 'voyager', name: 'OSM Voyager (CARTO)', tiles: ['a','b','c'].map(s => `https://${s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png`), max: 20,
    attr: '© OpenStreetMap, © <a href="https://carto.com/attributions">CARTO</a>' },
  { id: 'positron', name: 'Jasny (CARTO Positron)', tiles: ['a','b','c'].map(s => `https://${s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png`), max: 20,
    attr: '© OpenStreetMap, © <a href="https://carto.com/attributions">CARTO</a>' },
  { id: 'topo', name: 'OpenTopoMap', tiles: ['a','b','c'].map(s => `https://${s}.tile.opentopomap.org/{z}/{x}/{y}.png`), max: 17,
    attr: '© OpenStreetMap, SRTM, © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)' },
  { id: 'cyclosm', name: 'CyclOSM', tiles: ['a','b','c'].map(s => `https://${s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png`), max: 20,
    attr: '© OpenStreetMap, <a href="https://www.cyclosm.org">CyclOSM</a>' },
  { id: 'orto', name: 'Ortofotomapa (Geoportal)', tiles: [wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution', 'Raster')], max: 20,
    attr: 'Ortofotomapa © <a href="https://www.geoportal.gov.pl">GUGiK</a>' },
];
const DEFAULT_BASE = FROM_FILE ? 'voyager' : 'osm';
const HILLSHADE_TILES = [wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/NMT/GRID1/WMS/ShadedRelief', 'Raster')];

/* --- kolory --- */
const PTTK = { red: '#e0262b', blue: '#1f5fd1', green: '#1f9a3c', yellow: '#e8b800', black: '#222222',
  orange: '#f07d00', purple: '#8e3bb8', white: '#9aa0a6', brown: '#8a5a2b' };
const BIKE_FALLBACK = { icn: '#0b3d91', ncn: '#c2185b', rcn: '#6a1b9a', lcn: '#00838f' };
const INFRA = {
  droga:       { label: 'Droga dla rowerów',          color: '#c4007a', width: 2.6 },
  ciag:        { label: 'Ciąg pieszo-rowerowy',       color: '#e46fb3', width: 2.2 },
  przy_jezdni: { label: 'Droga rowerowa przy jezdni', color: '#c4007a', width: 2.2 },
  pas:         { label: 'Pas rowerowy',               color: '#ff7a00', width: 2.4 },
  kontrapas:   { label: 'Kontrapas',                  color: '#009e8f', width: 2.4 },
  kontraruch:  { label: 'Kontraruch (bez pasa)',      color: '#7cb342', width: 1.6 },
  buspas:      { label: 'Buspas dla rowerów',         color: '#3f51b5', width: 2.0 },
  sharrow:     { label: 'Sierżant rowerowy (P-27)',   color: '#8d8d8d', width: 1.6 },
};

/* =========================================================================
   OVERPASS: kolejka + kafle
   ========================================================================= */
function lon2tile(lon, z) { return Math.floor((lon + 180) / 360 * 2 ** z); }
function lat2tile(lat, z) { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); }
function tile2lon(x, z) { return x / 2 ** z * 360 - 180; }
function tile2lat(y, z) { const n = Math.PI - 2 * Math.PI * y / 2 ** z; return 180 / Math.PI * Math.atan(Math.sinh(n)); }
function tileBbox(x, y, z) { return [tile2lat(y + 1, z), tile2lon(x, z), tile2lat(y, z), tile2lon(x + 1, z)]; } // s,w,n,e
function intersect(a, b) { const r = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])]; return (r[0] < r[2] && r[1] < r[3]) ? r : null; }
function tilesFor(bbox) {
  const out = [];
  for (let x = lon2tile(bbox[1], TILE_Z); x <= lon2tile(bbox[3], TILE_Z); x++)
    for (let y = lat2tile(bbox[2], TILE_Z); y <= lat2tile(bbox[0], TILE_Z); y++) out.push([x, y]);
  return out;
}

function buildQuery(b) {
  const bb = b.map(v => v.toFixed(5)).join(',');
  return `[out:json][timeout:120];
rel[type=route][route~"^(bicycle|mtb|hiking|foot|walking)$"](${bb})->.r;
.r out body;
way(r.r)(${bb})->.rw;
(
  way[highway=cycleway](${bb});
  way[highway~"^(path|footway|pedestrian|track|service|living_street|bridleway)$"][bicycle=designated](${bb});
  way[highway][~"^cycleway(:both|:left|:right)?$"~"^(lane|opposite_lane|track|opposite_track|share_busway|opposite_share_busway|shared_lane|opposite)$"](${bb});
  way[highway]["oneway:bicycle"=no][oneway~"^(yes|-1|1|true)$"](${bb});
)->.inf;
(.rw; .inf;);
out geom;`;
}

let endpointIdx = 0;
const MAX_STALENESS_MS = 60 * 60 * 1000; // serwer z danymi starszymi niż 1 h odrzucamy (niektóre mirrory potrafią stać tygodniami)
async function overpass(query) {
  let lastErr;
  for (let attempt = 0; attempt < OVERPASS.length * 2; attempt++) {
    const url = OVERPASS[endpointIdx % OVERPASS.length];
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 100 * 1000);
    try {
      const res = await fetch(url, { method: 'POST', body: new URLSearchParams({ data: query }), signal: ctrl.signal });
      if (res.ok) {
        const json = await res.json();
        const base = json.osm3s && Date.parse(json.osm3s.timestamp_osm_base);
        if (base && Date.now() - base < MAX_STALENESS_MS) return json;
        lastErr = new Error(`${url} → nieaktualne dane (${json.osm3s && json.osm3s.timestamp_osm_base})`);
      } else lastErr = new Error(`${url} → HTTP ${res.status}`);
    } catch (e) { lastErr = e; } finally { clearTimeout(timer); }
    endpointIdx++;
    await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
  }
  throw lastErr;
}

/* --- prosty cache w IndexedDB (żeby przeładowanie strony nie męczyło Overpass) --- */
let dbp = null;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('mapa-szlakow', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tiles');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function cacheGet(key) {
  const d = await db();
  return new Promise((res, rej) => { const r = d.transaction('tiles').objectStore('tiles').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function cachePut(key, val) {
  const d = await db();
  return new Promise((res, rej) => { const tx = d.transaction('tiles', 'readwrite'); tx.objectStore('tiles').put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}

const tiles = new Map();  // key → { bbox, status, loadedAt, osmBase, elements }
let running = 0; const queue = [];
function enqueue(key) {
  const t = tiles.get(key);
  if (t.status === 'loading' || t.status === 'queued') return;
  t.status = 'queued'; queue.push(key); pump();
}
function pump() {
  while (running < MAX_PARALLEL && queue.length) {
    const key = queue.shift(); const t = tiles.get(key);
    running++; t.status = 'loading'; renderStatus();
    overpass(buildQuery(t.bbox)).then(json => {
      t.elements = json.elements; t.osmBase = json.osm3s && json.osm3s.timestamp_osm_base;
      t.loadedAt = Date.now(); t.status = 'ok'; t.fromCache = false; scheduleRebuild();
      cachePut(key, { elements: t.elements, osmBase: t.osmBase, loadedAt: t.loadedAt }).catch(() => {});
    }).catch(err => { console.error(err); t.status = 'error'; t.error = String(err.message || err); })
      .finally(() => { running--; renderStatus(); pump(); });
  }
}

// Mały region (Gdynia) = jedno zapytanie. Duży (Polska) = kafle z10 w widoku.
function wantedTiles() {
  if (REGION.preload) return [{ key: 'region/' + REGION.bbox.join(','), bbox: REGION.bbox }];
  if (map.getZoom() < MIN_DATA_ZOOM) return [];
  const b = map.getBounds();
  const view = intersect([b.getSouth(), b.getWest(), b.getNorth(), b.getEast()], REGION.bbox);
  return view ? tilesFor(view).map(([x, y]) => ({ key: `${TILE_Z}/${x}/${y}`, bbox: intersect(tileBbox(x, y, TILE_Z), REGION.bbox) })).filter(t => t.bbox) : [];
}
function requestTiles(force = false) {
  for (const { key, bbox } of wantedTiles()) {
    if (!tiles.has(key)) {
      tiles.set(key, { bbox, status: 'new' });
      // najpierw pokaż ostatnią kopię z przeglądarki (IndexedDB), potem odśwież w tle
      cacheGet(key).then(c => {
        const t = tiles.get(key);
        if (!c || t.elements) return;
        Object.assign(t, { elements: c.elements, osmBase: c.osmBase, loadedAt: c.loadedAt, fromCache: true });
        if (t.status === 'new') t.status = 'ok';
        scheduleRebuild();
        if (Date.now() - c.loadedAt > REFRESH_MS) enqueue(key);
      }).catch(() => {}).finally(() => { const t = tiles.get(key); if (t.status === 'new') enqueue(key); });
      continue;
    }
    const t = tiles.get(key);
    if (t.status === 'new' || t.status === 'error' || (force && t.status === 'ok') ||
        (t.status === 'ok' && Date.now() - t.loadedAt > REFRESH_MS)) enqueue(key);
  }
  renderStatus();
}

/* =========================================================================
   PRZETWARZANIE: relacje → odcinki z numerem „pasa” (slot) do offsetu
   ========================================================================= */
const KIND = { bicycle: 'bicycle', mtb: 'bicycle', hiking: 'hiking', foot: 'hiking', walking: 'hiking' };
const NET_RANK = { icn: 0, ncn: 1, rcn: 2, lcn: 3, iwn: 0, nwn: 1, rwn: 2, lwn: 3 };
const ROUTE_RANK = { bicycle: 0, mtb: 1, hiking: 2, foot: 3, walking: 4 };

function cssColor(c) {
  if (!c) return null; c = String(c).trim().toLowerCase();
  if (PTTK[c]) return PTTK[c];
  if (/^#?f{3}(f{3})?$/.test(c)) return PTTK.white; // biały szlak byłby niewidoczny
  if (/^[0-9a-f]{6}$/.test(c)) c = '#' + c;
  return (window.CSS && CSS.supports('color', c)) ? c : null;
}
function routeColor(tags) {
  const osmc = tags['osmc:symbol'] ? tags['osmc:symbol'].split(':')[0] : null;
  if (KIND[tags.route] === 'hiking') return cssColor(osmc) || cssColor(tags.colour) || PTTK.red;
  return cssColor(tags.colour) || cssColor(osmc) || BIKE_FALLBACK[tags.network] || '#6a1b9a';
}

// Ujednolicony kierunek odcinka (z grubsza „na wschód”), żeby offset
// sąsiednich odcinków tego samego szlaku wypadał po tej samej stronie.
function normalize(coords) {
  const a = coords[0], b = coords[coords.length - 1];
  const dx = (b[0] - a[0]) * Math.cos(a[1] * Math.PI / 180), dy = b[1] - a[1];
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  return (ang > 100 || ang <= -80) ? coords.slice().reverse() : coords;
}

function infraClasses(t) {
  const out = []; const hw = t.highway; if (!hw) return out;
  const oneway = ['yes', '1', 'true', '-1'].includes(t.oneway);
  if (hw === 'cycleway') {
    out.push({ cls: (t.foot === 'designated' && t.segregated !== 'yes') ? 'ciag' : 'droga', side: 0 });
    return out;
  }
  if (t.bicycle === 'designated' && /^(path|footway|pedestrian|track|service|living_street|bridleway)$/.test(hw)) {
    out.push({ cls: (t.foot === 'designated' || hw === 'footway' || hw === 'pedestrian') && t.segregated !== 'yes' ? 'ciag' : 'droga', side: 0 });
    return out;
  }
  const map1 = v => ({ lane: 'pas', opposite_lane: 'kontrapas', track: 'przy_jezdni', opposite_track: 'przy_jezdni',
    share_busway: 'buspas', opposite_share_busway: 'buspas', shared_lane: 'sharrow', opposite: 'kontraruch' })[v];
  const sideVal = (side, v) => {
    let cls = map1(v); if (!cls) return;
    if (cls === 'pas' && oneway && (t[`cycleway:${side}:oneway`] === '-1' || (side === 'left' && t['oneway:bicycle'] === 'no'))) cls = 'kontrapas';
    out.push({ cls, side: side === 'left' ? -1 : 1 });
  };
  if (t['cycleway:left']) sideVal('left', t['cycleway:left']);
  if (t['cycleway:right']) sideVal('right', t['cycleway:right']);
  if (t['cycleway:both']) { sideVal('left', t['cycleway:both']); sideVal('right', t['cycleway:both']); }
  if (t.cycleway && !out.length) {
    const cls = map1(t.cycleway);
    if (cls) {
      if (/^opposite/.test(t.cycleway)) out.push({ cls: cls === 'pas' ? 'kontrapas' : cls, side: cls === 'kontraruch' ? 0 : -1 });
      else if (oneway) out.push({ cls, side: 1 });
      else { out.push({ cls, side: -1 }); out.push({ cls, side: 1 }); }
    }
  }
  if (!out.length && oneway && t['oneway:bicycle'] === 'no') out.push({ cls: 'kontraruch', side: 0 });
  return out;
}

const routesById = new Map(); // id → tags (dla panelu)
const waysById = new Map();
let rebuildTimer = null;
function scheduleRebuild() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 150); }

function rebuild() {
  const rels = new Map(), ways = new Map();
  for (const t of tiles.values()) {
    if (!t.elements) continue;
    for (const e of t.elements) {
      if (e.type === 'relation') rels.set(e.id, e);
      else if (e.type === 'way' && e.geometry) ways.set(e.id, e);
    }
  }
  routesById.clear(); waysById.clear();
  for (const [id, w] of ways) waysById.set(id, w);

  // stała kolejność szlaków (międzynarodowe → lokalne, potem id),
  // dzięki której ten sam szlak zwykle trzyma ten sam „pas” na kolejnych odcinkach
  const ordered = [...rels.values()].filter(r => KIND[r.tags.route]).sort((a, b) =>
    (ROUTE_RANK[a.tags.route] - ROUTE_RANK[b.tags.route]) ||
    ((NET_RANK[a.tags.network] ?? 9) - (NET_RANK[b.tags.network] ?? 9)) || (a.id - b.id));

  const onWay = new Map(); // wayId → [rel]
  for (const r of ordered) {
    routesById.set(r.id, r.tags);
    const seen = new Set();
    for (const m of r.members) {
      if (m.type !== 'way' || !ways.has(m.ref) || seen.has(m.ref)) continue;
      seen.add(m.ref);
      if (!onWay.has(m.ref)) onWay.set(m.ref, []);
      onWay.get(m.ref).push(r);
    }
  }

  const routeFeatures = [];
  for (const [wayId, list] of onWay) {
    const coords = normalize(ways.get(wayId).geometry.map(p => [p.lon, p.lat]));
    list.forEach((r, slot) => routeFeatures.push({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: coords },
      properties: { rel: r.id, way: wayId, kind: KIND[r.tags.route], color: routeColor(r.tags), slot, n: list.length,
        name: r.tags.name || r.tags.ref || `relacja ${r.id}` },
    }));
  }

  const infraFeatures = [];
  let infraLen = 0;
  for (const [wayId, w] of ways) {
    const classes = infraClasses(w.tags || {});
    if (!classes.length) continue;
    const coords = w.geometry.map(p => [p.lon, p.lat]);
    for (const c of classes) {
      infraFeatures.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords },
        properties: { way: wayId, cls: c.cls, side: c.side, color: INFRA[c.cls].color, w: INFRA[c.cls].width } });
    }
    infraLen += lineLength(coords);
  }

  map.getSource('routes').setData({ type: 'FeatureCollection', features: routeFeatures });
  map.getSource('infra').setData({ type: 'FeatureCollection', features: infraFeatures });
  stats = {
    bicycle: ordered.filter(r => KIND[r.tags.route] === 'bicycle').length,
    hiking: ordered.filter(r => KIND[r.tags.route] === 'hiking').length,
    infraKm: infraLen / 1000,
  };
  if (selectedRel) select(selectedRel, false);
  renderStatus();
}

function lineLength(c) {
  let s = 0;
  for (let i = 1; i < c.length; i++) {
    const [x1, y1] = c[i - 1], [x2, y2] = c[i];
    const dx = (x2 - x1) * Math.cos((y1 + y2) / 2 * Math.PI / 180) * 111320, dy = (y2 - y1) * 110540;
    s += Math.hypot(dx, dy);
  }
  return s;
}

/* =========================================================================
   MAPA
   ========================================================================= */
const style = { version: 8, sources: {}, layers: [] };
for (const b of BASEMAPS) {
  style.sources[b.id] = { type: 'raster', tiles: b.tiles, tileSize: b.tiles[0].startsWith('retry://') ? 512 : 256, maxzoom: b.max, attribution: b.attr };
  style.layers.push({ id: 'base-' + b.id, type: 'raster', source: b.id, layout: { visibility: b.id === DEFAULT_BASE ? 'visible' : 'none' } });
}
style.sources.hillshade = { type: 'raster', tiles: HILLSHADE_TILES, tileSize: 512, minzoom: 6, maxzoom: 19,
  attribution: 'Cieniowanie NMT ISOK © <a href="https://www.geoportal.gov.pl">GUGiK</a>' };
style.layers.push({ id: 'hillshade', type: 'raster', source: 'hillshade', paint: { 'raster-opacity': 0.35 } });

const map = new maplibregl.Map({
  container: 'map', style, center: REGION.center, zoom: REGION.zoom, minZoom: 5, maxZoom: 19,
  hash: true, attributionControl: { compact: false },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
let stats = null, selectedRel = null;

// Offset rośnie z numerem pasa (slot) i ze zoomem.
const z = (pairs) => ['interpolate', ['linear'], ['zoom'], ...pairs.flat()];
const ROUTE_WIDTH = z([[10, 1.4], [13, 2.4], [16, 3.6], [19, 6]]);
const ROUTE_OFFSET = z([
  [10, ['*', ['+', ['get', 'slot'], 1], 2.2]],
  [13, ['*', ['+', ['get', 'slot'], 1], 3.4]],
  [16, ['*', ['+', ['get', 'slot'], 1], 5.2]],
  [19, ['*', ['+', ['get', 'slot'], 1], 8.5]],
]);

map.once('style.load', () => { // nie czekamy na 'load' (wolne kafle WMS opóźniałyby dane)
  map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] },
    attribution: 'Szlaki i drogi rowerowe: © OpenStreetMap (ODbL) via Overpass API' });
  map.addSource('infra', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

  // infrastruktura (pod szlakami); pasy po stronie jezdni wg tagów left/right
  map.addLayer({ id: 'infra', type: 'line', source: 'infra', minzoom: 11,
    layout: { 'line-cap': 'butt', 'line-join': 'round' },
    paint: {
      'line-color': ['get', 'color'],
      'line-width': ['interpolate', ['linear'], ['zoom'], 11, ['*', ['get', 'w'], 0.5], 15, ['get', 'w'], 18, ['*', ['get', 'w'], 1.8]],
      'line-offset': ['interpolate', ['linear'], ['zoom'], 13, ['*', ['get', 'side'], 1], 16, ['*', ['get', 'side'], 3.5], 19, ['*', ['get', 'side'], 9]],
      'line-opacity': 0.9,
    } });

  // podświetlenie wybranego szlaku
  map.addLayer({ id: 'route-selected', type: 'line', source: 'routes', filter: ['==', ['get', 'rel'], -1],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffd60a', 'line-opacity': 0.75, 'line-offset': ROUTE_OFFSET,
      'line-width': z([[10, 6], [13, 8], [16, 11], [19, 16]]) } });

  for (const kind of ['hiking', 'bicycle']) {
    const isBike = kind === 'bicycle';
    map.addLayer({ id: `${kind}-casing`, type: 'line', source: 'routes', filter: ['==', ['get', 'kind'], kind],
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-opacity': 0.55, 'line-offset': ROUTE_OFFSET,
        'line-width': z([[10, 2.2], [13, 3.4], [16, 5], [19, 8]]) } });
    map.addLayer({ id: kind, type: 'line', source: 'routes', filter: ['==', ['get', 'kind'], kind],
      layout: { 'line-cap': isBike ? 'round' : 'butt', 'line-join': 'round' },
      paint: {
        'line-color': ['get', 'color'], 'line-offset': ROUTE_OFFSET, 'line-width': ROUTE_WIDTH,
        // rowerowe: kropki (kreska 0 + okrągłe zakończenie), piesze: kreski
        'line-dasharray': isBike ? [0, 1.9] : [2.6, 1.6],
      } });
  }
  // szerokość podświetlenia większa niż linia
  map.setPaintProperty('route-selected', 'line-width', z([[10, 6], [13, 8], [16, 11], [19, 16]]));

  requestTiles();
  setInterval(() => requestTiles(), 30 * 1000); // sprawdza co 30 s, czy któryś kafel jest starszy niż REFRESH_MS
  map.on('moveend', () => { if (!REGION.preload) requestTiles(); });
  if (!location.hash && REGION.preload) map.fitBounds([[REGION.bbox[1], REGION.bbox[0]], [REGION.bbox[3], REGION.bbox[2]]], { padding: 20, duration: 0 });
});

/* --- klik: dane relacji --- */
const CLICK_LAYERS = ['bicycle', 'hiking', 'infra'];
map.on('click', (ev) => {
  const p = ev.point, r = 7;
  const feats = map.queryRenderedFeatures([[p.x - r, p.y - r], [p.x + r, p.y + r]], { layers: CLICK_LAYERS.filter(l => map.getLayer(l)) });
  if (!feats.length) { closeInfo(); return; }
  const rels = [...new Set(feats.filter(f => f.layer.id !== 'infra').map(f => f.properties.rel))];
  const infraWays = [...new Set(feats.filter(f => f.layer.id === 'infra').map(f => f.properties.way))];
  showInfo(rels, infraWays);
});
for (const l of CLICK_LAYERS) {
  map.on('mouseenter', l, () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', l, () => map.getCanvas().style.cursor = '');
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function tagTable(tags) {
  return '<table class="tags">' + Object.keys(tags).sort().map(k =>
    `<tr><td>${esc(k)}</td><td>${/^(website|url|wikipedia)$/.test(k) && /^https?:/.test(tags[k]) ? `<a href="${esc(tags[k])}" target="_blank" rel="noopener">${esc(tags[k])}</a>` : esc(tags[k])}</td></tr>`).join('') + '</table>';
}
const NET_PL = { icn: 'międzynarodowy', ncn: 'krajowy', rcn: 'regionalny', lcn: 'lokalny', iwn: 'międzynarodowy', nwn: 'krajowy', rwn: 'regionalny', lwn: 'lokalny' };

function showInfo(rels, infraWays) {
  const el = document.getElementById('info');
  let html = '<button class="close" aria-label="Zamknij">×</button>';
  for (const id of rels) {
    const t = routesById.get(id) || {};
    const kind = KIND[t.route] === 'bicycle' ? 'Szlak rowerowy' : 'Szlak pieszy';
    const wmt = KIND[t.route] === 'bicycle' ? 'cycling' : 'hiking';
    const meta = [kind, NET_PL[t.network], t.ref && `nr ${t.ref}`, t.distance && `${t.distance} km`, t.operator].filter(Boolean).map(esc).join(' · ');
    html += `<div class="route-card" data-rel="${id}">
      <h3><span class="chip" style="background:${routeColor(t)}"></span>${esc(t.name || t.ref || 'relacja ' + id)}</h3>
      <div class="meta">${meta}</div>
      <div class="links"><a href="https://www.openstreetmap.org/relation/${id}" target="_blank" rel="noopener">OSM</a>
        <a href="https://${wmt}.waymarkedtrails.org/#route?id=${id}" target="_blank" rel="noopener">Waymarked Trails</a>
        <a href="https://www.openstreetmap.org/edit?relation=${id}" target="_blank" rel="noopener">Edytuj</a>
        <a href="#" data-zoom="${id}">Przybliż</a></div>
      ${tagTable(t)}</div>`;
  }
  if (infraWays.length) {
    html += `<div class="route-card"><h3>Infrastruktura rowerowa</h3>`;
    for (const wid of infraWays) {
      const w = waysById.get(wid); if (!w) continue;
      const cls = infraClasses(w.tags).map(c => INFRA[c.cls].label + (c.side ? (c.side < 0 ? ' (lewa)' : ' (prawa)') : ''));
      html += `<details ${rels.length ? '' : 'open'}><summary>${esc([...new Set(cls)].join(', '))} — <a href="https://www.openstreetmap.org/way/${wid}" target="_blank" rel="noopener">droga ${wid}</a></summary>${tagTable(w.tags)}</details>`;
    }
    html += '</div>';
  }
  el.innerHTML = html; el.classList.add('open'); el.scrollTop = 0;
  el.querySelector('.close').onclick = closeInfo;
  el.querySelectorAll('[data-zoom]').forEach(a => a.onclick = (e) => { e.preventDefault(); zoomToRel(+a.dataset.zoom); });
  el.querySelectorAll('.route-card[data-rel]').forEach(c => c.onmouseenter = () => select(+c.dataset.rel, false));
  select(rels[0] ?? null, false);
}
function closeInfo() { document.getElementById('info').classList.remove('open'); select(null); }
function select(id) {
  selectedRel = id;
  if (map.getLayer('route-selected')) map.setFilter('route-selected', ['==', ['get', 'rel'], id ?? -1]);
}
function zoomToRel(id) {
  const fs = map.getSource('routes')._data.features.filter(f => f.properties.rel === id);
  if (!fs.length) return;
  let b = new maplibregl.LngLatBounds();
  fs.forEach(f => f.geometry.coordinates.forEach(c => b.extend(c)));
  map.fitBounds(b, { padding: 60, maxZoom: 16 });
}

/* =========================================================================
   UI
   ========================================================================= */
document.getElementById('region-name').textContent = `Prototyp · obszar: ${REGION.name}`;
const bmBox = document.getElementById('basemaps');
for (const b of BASEMAPS) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="radio" name="basemap" value="${b.id}" ${b.id === DEFAULT_BASE ? 'checked' : ''}> ${esc(b.name)}`;
  bmBox.appendChild(l);
}
bmBox.addEventListener('change', (e) => {
  for (const b of BASEMAPS) map.setLayoutProperty('base-' + b.id, 'visibility', b.id === e.target.value ? 'visible' : 'none');
});
document.getElementById('hillshade').onchange = (e) => map.setLayoutProperty('hillshade', 'visibility', e.target.checked ? 'visible' : 'none');
document.getElementById('hillshade-opacity').oninput = (e) => map.setPaintProperty('hillshade', 'raster-opacity', e.target.value / 100);
const toggle = (id, layers) => document.getElementById(id).onchange = (e) =>
  layers.forEach(l => map.getLayer(l) && map.setLayoutProperty(l, 'visibility', e.target.checked ? 'visible' : 'none'));
toggle('lyr-bicycle', ['bicycle', 'bicycle-casing']);
toggle('lyr-hiking', ['hiking', 'hiking-casing']);
toggle('lyr-infra', ['infra']);
document.getElementById('refresh').onclick = () => requestTiles(true);
document.getElementById('toggle-controls').onclick = () => document.getElementById('controls').classList.toggle('collapsed');
if (matchMedia('(max-width: 640px)').matches) document.getElementById('controls').classList.add('collapsed');

document.getElementById('legend-infra').innerHTML = Object.values(INFRA).map(i =>
  `<div class="legend-row"><span class="swatch" style="background:${i.color};height:${Math.max(3, i.width * 1.5)}px"></span>${esc(i.label)}</div>`).join('');
// legenda szlaków (dodana pod checkboxami)
(function () {
  const svgDots = c => `<svg width="34" height="8"><line x1="3" y1="4" x2="33" y2="4" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 7"/></svg>`;
  const svgDash = c => `<svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="${c}" stroke-width="3" stroke-dasharray="8 4"/></svg>`;
  document.getElementById('lyr-bicycle').parentElement.insertAdjacentHTML('afterend',
    `<div class="legend-row">${svgDots(PTTK.red)}${svgDots(PTTK.blue)}</div>`);
  document.getElementById('lyr-hiking').parentElement.insertAdjacentHTML('afterend',
    `<div class="legend-row">${svgDash(PTTK.red)}${svgDash(PTTK.green)}</div>`);
})();

function renderStatus() {
  const all = [...tiles.values()];
  const loading = all.filter(t => t.status === 'loading' || t.status === 'queued').length;
  const errors = all.filter(t => t.status === 'error');
  const bases = all.map(t => t.osmBase).filter(Boolean).sort();
  const fmt = iso => new Date(iso).toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'medium' });
  let s = '';
  if (stats) s += `<b>${stats.bicycle}</b> szlaków rowerowych · <b>${stats.hiking}</b> pieszych<br><b>${stats.infraKm.toFixed(0)} km</b> dróg z infrastrukturą rowerową<br>`;
  if (bases.length) s += `Stan bazy OSM: <b>${fmt(bases[0])}</b>${all.some(t => t.fromCache) ? ' (z pamięci podręcznej)' : ''}<br>`;
  if (loading) s += `Pobieranie z Overpass… (${loading} ${loading === 1 ? 'kafel' : 'kafle'})<br>`;
  if (errors.length) s += `<span style="color:#d33">Błąd pobierania ${errors.length} kafli – spróbuj „Odśwież teraz”.</span><br>`;
  if (!REGION.preload && map.getZoom() < MIN_DATA_ZOOM) s += `Przybliż mapę (zoom ≥ ${MIN_DATA_ZOOM}), aby wczytać szlaki.<br>`;
  s += `Auto-odświeżanie co ${REFRESH_MS / 60000} min.`;
  document.getElementById('status').innerHTML = s;
}
</script>
</body>
</html>
