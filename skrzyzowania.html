<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skrzyżowania – prosty edytor</title>
<style>
html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:#eef0e6}
#bar{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fffd;padding:8px 10px;border-radius:8px;z-index:2;box-shadow:0 1px 4px #0003}
canvas{display:block;touch-action:none}
button,select{font:inherit;padding:4px 8px}
label{display:flex;gap:6px;align-items:center}
</style></head><body>
<div id="bar">
<button id="nw">+ Nowa droga</button>
<select id="cls"><option value="3.5">service (3,5 m)</option><option value="5" selected>residential (5 m)</option><option value="6.5">tertiary (6,5 m)</option><option value="7.5">secondary (7,5 m)</option><option value="9">primary (9 m)</option></select>
<label>Promień rogów <input id="rr" type="range" min="0" max="12" step="0.5" value="4"><b id="rv">4 m</b></label>
<button id="cl">Wyczyść</button>
<span>Klik = dodaj punkt do ostatniej drogi, przeciągnij punkt = przesuń, prawy klik na punkcie = usuń.</span>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="sm" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="fg" stdDeviation="8"/><feComponentTransfer><feFuncA type="linear" slope="20" intercept="-9.5"/></feComponentTransfer></filter>
</defs></svg>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d'); const PX = 12; /* px na metr */
let roads = [], drag = null;
const mk = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return c; };
function size() { cv.width = innerWidth; cv.height = innerHeight; draw(); } addEventListener('resize', size);
try { roads = JSON.parse(localStorage.getItem('skrz') || '[]'); } catch (e) {}
if (!roads.length) roads = [{ w: 7.5, p: [[150, 300], [450, 300], [750, 300]] }, { w: 5, p: [[450, 80], [450, 300]] }, { w: 5, p: [[450, 520], [450, 300]] }];
const save = () => { try { localStorage.setItem('skrz', JSON.stringify(roads)); } catch (e) {} };
function draw() {
  const W = cv.width, H = cv.height, r = +rr.value * PX; rv.textContent = rr.value + ' m';
  const A = mk(), a = A.getContext('2d'); a.lineCap = a.lineJoin = 'round'; a.strokeStyle = '#000';
  for (const d of roads) { if (d.p.length < 2) continue; a.lineWidth = d.w * PX; a.beginPath(); d.p.forEach((q, i) => i ? a.lineTo(q[0], q[1]) : a.moveTo(q[0], q[1])); a.stroke(); }
  /* zaokraglenie rogow: rozmycie + prog alfa (okrag o promieniu ~r w kazdym rogu, takze wkleslym) */
  const M = mk(), m = M.getContext('2d'); fg.setAttribute('stdDeviation', Math.max(0.01, r / 2)); m.filter = r > 0 ? 'url(#sm)' : 'none'; m.drawImage(A, 0, 0); m.filter = 'none';
  /* tlo, krawezniki (maska powiekszona), asfalt, biala linia przy krawedzi */
  g.clearRect(0, 0, W, H); g.fillStyle = '#eef0e6'; g.fillRect(0, 0, W, H);
    const tint = (src, col) => { const T = mk(), t = T.getContext('2d'); t.drawImage(src, 0, 0); t.globalCompositeOperation = 'source-in'; t.fillStyle = col; t.fillRect(0, 0, W, H); return T; };
  const grow = (src, px) => { const T = mk(), t = T.getContext('2d'); for (let i = 0; i < 16; i++) { const an = i * Math.PI / 8; t.drawImage(src, Math.cos(an) * px, Math.sin(an) * px); } return T; };
  const shrink = (src, px) => { const T = mk(), t = T.getContext('2d'); t.drawImage(src, 0, 0); t.globalCompositeOperation = 'destination-in'; for (let i = 0; i < 16; i++) { const an = i * Math.PI / 8; t.drawImage(src, Math.cos(an) * px, Math.sin(an) * px); } return T; };
  g.drawImage(tint(grow(M, 0.8 * PX), '#7b7d77'), 0, 0); g.drawImage(tint(grow(M, 0.45 * PX), '#c4c6c0'), 0, 0);
  g.drawImage(tint(M, '#7c8083'), 0, 0);
  const inner = shrink(M, 0.2 * PX), edge = mk(), e = edge.getContext('2d'); e.drawImage(M, 0, 0); e.globalCompositeOperation = 'destination-out'; e.drawImage(inner, 0, 0);
  const lo = shrink(M, 0.55 * PX), ring = mk(), rg = ring.getContext('2d'); rg.drawImage(M, 0, 0); rg.globalCompositeOperation = 'destination-out'; rg.drawImage(lo, 0, 0);
  g.drawImage(tint(edge, '#f2f2f2'), 0, 0);
  /* osie i punkty */
  g.lineWidth = 1; g.strokeStyle = '#2a6bd6aa';
  for (const d of roads) { g.beginPath(); d.p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.stroke(); for (const q of d.p) { g.beginPath(); g.arc(q[0], q[1], 4, 0, 7); g.fillStyle = '#fff'; g.fill(); g.stroke(); } }
}
const pos = ev => [ev.clientX, ev.clientY];
const hit = p => { for (let i = 0; i < roads.length; i++) for (let j = 0; j < roads[i].p.length; j++) if (Math.hypot(roads[i].p[j][0] - p[0], roads[i].p[j][1] - p[1]) < 9) return [i, j]; return null; };
cv.onpointerdown = ev => { const p = pos(ev); if (ev.button === 2) return; const h = hit(p); if (h) { drag = h; cv.setPointerCapture(ev.pointerId); return; } if (!roads.length) roads.push({ w: +cls.value, p: [] }); roads[roads.length - 1].p.push(p); save(); draw(); };
cv.onpointermove = ev => { if (!drag) return; roads[drag[0]].p[drag[1]] = pos(ev); draw(); };
cv.onpointerup = () => { if (drag) { drag = null; save(); } };
cv.oncontextmenu = ev => { ev.preventDefault(); const h = hit(pos(ev)); if (h) { roads[h[0]].p.splice(h[1], 1); if (roads[h[0]].p.length < 1) roads.splice(h[0], 1); save(); draw(); } };
nw.onclick = () => { roads.push({ w: +cls.value, p: [] }); save(); };
cl.onclick = () => { roads = []; save(); draw(); };
cls.onchange = () => { if (roads.length) { roads[roads.length - 1].w = +cls.value; save(); draw(); } };
rr.oninput = draw; size();
</script></body></html>
