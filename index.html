<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Szlaków</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/config.js"></script>
<style>
:root {
  --bg: #ffffff; --fg: #1d2125; --muted: #5f6b76; --line: #dde2e7; --panel: rgba(255,255,255,.96);
  --accent: #0b6bcb; --shadow: 0 2px 12px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181b; --fg: #e8ecef; --muted: #9aa6b1; --line: #2c3238; --panel: rgba(24,27,31,.96);
    --accent: #5aa9ff; --shadow: 0 2px 12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #15181b; --fg: #e8ecef; --muted: #9aa6b1; --line: #2c3238; --panel: rgba(24,27,31,.96);
  --accent: #5aa9ff; --shadow: 0 2px 12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#map { position: absolute; inset: 0; }

/* --- minimalny CSS MapLibre (bez zewnętrznego arkusza) --- */
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-top-left
  { position: absolute; pointer-events: none; z-index: 2; }
.maplibregl-ctrl-top-right { top: 0; right: 0; } .maplibregl-ctrl-bottom-right { bottom: 0; right: 0; }
.maplibregl-ctrl-bottom-left { bottom: 0; left: 0; } .maplibregl-ctrl-top-left { top: 0; left: 0; }
.maplibregl-ctrl { pointer-events: auto; clear: both; }
.maplibregl-ctrl-top-right .maplibregl-ctrl { float: right; margin: 10px 10px 0 0; }
.maplibregl-ctrl-bottom-right .maplibregl-ctrl { float: right; margin: 0 10px 10px 0; }
.maplibregl-ctrl-bottom-left .maplibregl-ctrl { float: left; margin: 0 0 10px 10px; }
.maplibregl-ctrl-group { background: #fff; border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
.maplibregl-ctrl-group button { width: 32px; height: 32px; display: block; border: 0; background: transparent; cursor: pointer; padding: 0; }
.maplibregl-ctrl-group button + button { border-top: 1px solid #ddd; }
.maplibregl-ctrl-group button:hover { background: #f0f0f0; }
.maplibregl-ctrl-icon { display: block; width: 100%; height: 100%; background-repeat: no-repeat; background-position: center; }
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Cpath d='M14.5 8.5c-.75 0-1.5.75-1.5 1.5v3h-3c-.75 0-1.5.75-1.5 1.5S9.25 16 10 16h3v3c0 .75.75 1.5 1.5 1.5S16 19.75 16 19v-3h3c.75 0 1.5-.75 1.5-1.5S19.75 13 19 13h-3v-3c0-.75-.75-1.5-1.5-1.5z' fill='%23333'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Cpath d='M10 13c-.75 0-1.5.75-1.5 1.5S9.25 16 10 16h9c.75 0 1.5-.75 1.5-1.5S19.75 13 19 13h-9z' fill='%23333'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-compass .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Cpath d='m10.5 14 4-8 4 8h-8z' fill='%23d33'/%3E%3Cpath d='m10.5 16 4 8 4-8h-8z' fill='%23999'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-geolocate .maplibregl-ctrl-icon { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Ccircle cx='14.5' cy='14.5' r='4' fill='none' stroke='%23333' stroke-width='2'/%3E%3Cpath d='M14.5 6v4M14.5 19v4M6 14.5h4M19 14.5h4' stroke='%23333' stroke-width='2'/%3E%3C/svg%3E"); }
.maplibregl-ctrl-attrib { background: rgba(255,255,255,.8); padding: 2px 6px; font-size: 11px; color: #333; border-radius: 4px 0 0 0; margin: 0 !important; }
.maplibregl-ctrl-attrib a { color: #333; }
.maplibregl-ctrl-attrib-button { display: none; }
.maplibregl-ctrl-scale { background: rgba(255,255,255,.8); border: 2px solid #333; border-top: 0; font-size: 10px; padding: 0 5px; color: #333; }
.maplibregl-user-location-dot { width: 14px; height: 14px; border-radius: 50%; background: #1da1f2; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.4); }
.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }

/* --- panel boczny --- */
.panel { position: absolute; z-index: 5; background: var(--panel); color: var(--fg); box-shadow: var(--shadow); border-radius: 10px; }
#controls { top: 10px; left: 10px; width: 270px; max-height: calc(100% - 20px); overflow: auto; padding: 12px 14px; }
#controls h1 { font-size: 16px; margin: 0 0 2px; }
#controls .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
#controls h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; }
#controls label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
#controls input[type=range] { width: 100%; }
.swatch { width: 34px; height: 10px; flex: none; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 2px 0 2px 22px; }
#status { font-size: 12px; color: var(--muted); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
#status b { color: var(--fg); font-weight: 600; }
button.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-top: 6px; }
button.btn:hover { border-color: var(--accent); }
#toggle-controls { display: none; }

#info { top: 10px; right: 54px; width: 360px; max-height: calc(100% - 60px); overflow: auto; padding: 12px 14px; display: none; }
#info.open { display: block; }
#info .close { position: sticky; top: 0; float: right; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
.route-card { border-top: 1px solid var(--line); padding: 10px 0 6px; }
.route-card:first-of-type { border-top: 0; padding-top: 0; }
.route-card h3 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.route-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.route-card .links a { color: var(--accent); font-size: 12.5px; margin-right: 10px; }
.chip { display: inline-block; width: 22px; height: 6px; border-radius: 3px; flex: none; }
table.tags { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
table.tags td { padding: 2px 4px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
table.tags td:first-child { color: var(--muted); width: 40%; font-family: ui-monospace, Menlo, Consolas, monospace; }
details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 4px; }

@media (max-width: 640px) {
  #controls { width: auto; right: 10px; max-height: 55%; }
  #controls.collapsed > :not(.head) { display: none; }
  #toggle-controls { display: inline-block; }
  #info { left: 10px; right: 10px; top: auto; bottom: 26px; width: auto; max-height: 50%; }
}
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <div class="head">
    <h1>Mapa Szlaków <button class="btn" id="toggle-controls" style="float:right;margin:0">Warstwy</button></h1>
    <div class="sub" id="region-name">Prototyp</div>
  </div>

  <h2>Podkład</h2>
  <div id="basemaps"></div>

  <h2>Nakładki</h2>
  <label><input type="checkbox" id="hillshade" checked> Cieniowanie ISOK (Geoportal)</label>
  <input type="range" id="hillshade-opacity" min="0" max="100" value="35" aria-label="Przezroczystość cieniowania">

  <h2>Szlaki (relacje OSM)</h2>
  <label><input type="checkbox" id="lyr-bicycle" checked> Rowerowe <span style="color:var(--muted)">(kropki)</span></label>
  <label><input type="checkbox" id="lyr-hiking" checked> Piesze <span style="color:var(--muted)">(kreski)</span></label>

  <h2>Infrastruktura rowerowa</h2>
  <label><input type="checkbox" id="lyr-infra" checked> Pokaż</label>
  <div id="legend-infra"></div>

  <div id="status">Ładowanie danych…</div>
  <button class="btn" id="refresh">Odśwież teraz</button>
</div>

<div id="info" class="panel" role="dialog" aria-label="Dane szlaku"></div>

<script>
'use strict';

/* =========================================================================
   KONFIGURACJA
   Region jest tylko prostokątem + flagą, czy ładować całość od razu.
   Rozszerzenie na Polskę: ?region=polska (dociąga kafle widoku od zoom 10).
   ========================================================================= */
const { REGIONS, OVERPASS, buildQuery } = window.MS_CONFIG;
const params = new URLSearchParams(location.search);
const REGION_ID = REGIONS[params.get('region')] ? params.get('region') : 'gdynia';
const REGION = REGIONS[REGION_ID];

const TILE_Z = 10;               // siatka kafli zapytań Overpass (z10 ≈ 25×40 km)
const MIN_DATA_ZOOM = 10;        // poniżej nie dociągamy danych (dla dużych regionów)
const REFRESH_MS = 5 * 60 * 1000; // co ile odświeżać widoczne kafle
const MAX_PARALLEL = 2;          // grzeczność wobec publicznego Overpass

/* --- podkłady --- */
// WMS Geoportalu przez protokół „retry://”: limit równoległych żądań + ponawianie przy 503
// (serwer GUGiK odrzuca zbyt wiele jednoczesnych zapytań). Kafle 512 px = 4× mniej żądań.
const wms = (url, layer, extra = '') =>
  `retry://${url}?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=${layer}&STYLES=&FORMAT=image/png&TRANSPARENT=TRUE&CRS=EPSG:3857&WIDTH=512&HEIGHT=512&BBOX={bbox-epsg-3857}${extra}`;
const RETRY_PARALLEL = 4; let retryActive = 0; const retryWaiting = [];
const retrySlot = () => new Promise(res => retryActive < RETRY_PARALLEL ? (retryActive++, res()) : retryWaiting.push(res));
const retryFree = () => { const n = retryWaiting.shift(); n ? n() : retryActive--; };
maplibregl.addProtocol('retry', async (params, abortController) => {
  const url = params.url.replace(/^retry:\/\//, '');
  await retrySlot();
  try {
    for (let i = 0; ; i++) {
      if (abortController.signal.aborted) throw new Error('aborted');
      const res = await fetch(url, { signal: abortController.signal });
      if (res.ok) return { data: await res.arrayBuffer() };
      if (i >= 4 || ![429, 500, 502, 503, 504].includes(res.status)) throw new Error(`HTTP ${res.status}`);
      await new Promise(r => setTimeout(r, 400 * 2 ** i + Math.random() * 300));
    }
  } finally { retryFree(); }
});

// Serwery tile.openstreetmap.org blokują strony otwierane z dysku (file://, brak nagłówka Referer).
// Wtedy domyślnym podkładem jest CARTO Voyager (też rysowany z danych OSM).
const FROM_FILE = location.protocol === 'file:';
const BASEMAPS = [
  { id: 'osm', name: FROM_FILE ? 'OpenStreetMap (nie działa z pliku)' : 'OpenStreetMap', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], max: 19,
    attr: '© <a href="https://www.openstreetmap.org/copyright">autorzy OpenStreetMap</a>' },
  { id: 'voyager', name: 'OSM Voyager (CARTO)', tiles: ['a','b','c'].map(s => `https://${s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png`), max: 20,
    attr: '© OpenStreetMap, © <a href="https://carto.com/attributions">CARTO</a>' },
  { id: 'positron', name: 'Jasny (CARTO Positron)', tiles: ['a','b','c'].map(s => `https://${s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png`), max: 20,
    attr: '© OpenStreetMap, © <a href="https://carto.com/attributions">CARTO</a>' },
  { id: 'topo', name: 'OpenTopoMap', tiles: ['a','b','c'].map(s => `https://${s}.tile.opentopomap.org/{z}/{x}/{y}.png`), max: 17,
    attr: '© OpenStreetMap, SRTM, © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)' },
  { id: 'cyclosm', name: 'CyclOSM', tiles: ['a','b','c'].map(s => `https://${s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png`), max: 20,
    attr: '© OpenStreetMap, <a href="https://www.cyclosm.org">CyclOSM</a>' },
  { id: 'orto', name: 'Ortofotomapa (Geoportal)', tiles: [wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution', 'Raster')], max: 20,
    attr: 'Ortofotomapa © <a href="https://www.geoportal.gov.pl">GUGiK</a>' },
];
const DEFAULT_BASE = FROM_FILE ? 'voyager' : 'osm';
const HILLSHADE_TILES = [wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/NMT/GRID1/WMS/ShadedRelief', 'Raster')];

/* --- kolory --- */
const PTTK = { red: '#e0262b', blue: '#1f5fd1', green: '#1f9a3c', yellow: '#e8b800', black: '#222222',
  orange: '#f07d00', purple: '#8e3bb8', white: '#9aa0a6', brown: '#8a5a2b' };
const BIKE_FALLBACK = { icn: '#0b3d91', ncn: '#c2185b', rcn: '#6a1b9a', lcn: '#00838f' };
// Infrastruktura rowerowa: paleta niebieska. dash = wzór przerywania (inny niż kreski szlaków pieszych).
const INFRA = {
  droga:      { label: 'Droga dla rowerów (C-13)',    color: '#24508f', width: 3.0, casing: true, icon: 'c13' },
  ciag:       { label: 'Ciąg pieszo-rowerowy (C-13/16)', color: '#74a6d2', width: 2.6, casing: true, icon: 'c13c16' },
  pas:        { label: 'Pas rowerowy',                color: '#3d82c4', width: 2.4 },
  kontrapas:  { label: 'Kontrapas',                   color: '#3d82c4', width: 2.6, dash: [1.1, 0.7] },
  kontraruch: { label: 'Kontraruch (bez pasa)',       color: '#5a9bd0', width: 1.8, dash: [0.4, 1.0] },
  buspas:     { label: 'Buspas dla rowerów',          color: '#6668ab', width: 2.4 },
  sharrow:    { label: 'Sierżant rowerowy (P-27)',    color: '#9fc0de', width: 1.8 },
  przejazd:   { label: 'Przejazd dla rowerów (P-11)', color: '#bf3b37', width: 3.0 },
};

/* =========================================================================
   OVERPASS: kolejka + kafle
   ========================================================================= */
function lon2tile(lon, z) { return Math.floor((lon + 180) / 360 * 2 ** z); }
function lat2tile(lat, z) { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); }
function tile2lon(x, z) { return x / 2 ** z * 360 - 180; }
function tile2lat(y, z) { const n = Math.PI - 2 * Math.PI * y / 2 ** z; return 180 / Math.PI * Math.atan(Math.sinh(n)); }
function tileBbox(x, y, z) { return [tile2lat(y + 1, z), tile2lon(x, z), tile2lat(y, z), tile2lon(x + 1, z)]; } // s,w,n,e
function intersect(a, b) { const r = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])]; return (r[0] < r[2] && r[1] < r[3]) ? r : null; }
function tilesFor(bbox) {
  const out = [];
  for (let x = lon2tile(bbox[1], TILE_Z); x <= lon2tile(bbox[3], TILE_Z); x++)
    for (let y = lat2tile(bbox[2], TILE_Z); y <= lat2tile(bbox[0], TILE_Z); y++) out.push([x, y]);
  return out;
}


let endpointIdx = 0;
const MAX_STALENESS_MS = 60 * 60 * 1000; // serwer z danymi starszymi niż 1 h odrzucamy (niektóre mirrory potrafią stać tygodniami)
async function overpass(query, onAttempt = () => {}) {
  let lastErr;
  for (let attempt = 0; attempt < OVERPASS.length * 2; attempt++) {
    const url = OVERPASS[endpointIdx % OVERPASS.length];
    onAttempt({ server: new URL(url).hostname, attempt: attempt + 1, lastErr });
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 90 * 1000);
    try {
      const res = await fetch(url, { method: 'POST', body: new URLSearchParams({ data: query }), signal: ctrl.signal });
      if (res.ok) {
        const json = await res.json();
        const base = json.osm3s && Date.parse(json.osm3s.timestamp_osm_base);
        if (base && Date.now() - base < MAX_STALENESS_MS) return json;
        lastErr = new Error(`${url} → nieaktualne dane (${json.osm3s && json.osm3s.timestamp_osm_base})`);
      } else lastErr = new Error(`${url} → HTTP ${res.status}`);
    } catch (e) { lastErr = e.name === 'AbortError' ? new Error(`${url} → brak odpowiedzi w 90 s`) : e; } finally { clearTimeout(timer); }
    endpointIdx++;
    await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
  }
  throw lastErr;
}

/* --- prosty cache w IndexedDB (żeby przeładowanie strony nie męczyło Overpass) --- */
let dbp = null;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('mapa-szlakow', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tiles');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function cacheGet(key) {
  const d = await db();
  return new Promise((res, rej) => { const r = d.transaction('tiles').objectStore('tiles').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function cachePut(key, val) {
  const d = await db();
  return new Promise((res, rej) => { const tx = d.transaction('tiles', 'readwrite'); tx.objectStore('tiles').put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}

async function fetchSnapshot() {
  try {
    const res = await fetch(`data/${REGION_ID}.json`, { cache: 'no-cache' });
    if (!res.ok) return null;
    const j = await res.json();
    return { elements: j.elements, osmBase: j.osmBase, loadedAt: Date.parse(j.osmBase) };
  } catch { return null; }
}

const tiles = new Map();  // key → { bbox, status, loadedAt, osmBase, elements }
let running = 0; const queue = [];
function enqueue(key) {
  const t = tiles.get(key);
  if (t.status === 'loading' || t.status === 'queued') return;
  t.status = 'queued'; queue.push(key); pump();
}
function pump() {
  while (running < MAX_PARALLEL && queue.length) {
    const key = queue.shift(); const t = tiles.get(key);
    running++; t.status = 'loading'; t.startedAt = Date.now(); t.error = null; renderStatus();
    overpass(buildQuery(t.bbox), info => { t.attemptInfo = info; renderStatus(); }).then(json => {
      t.elements = json.elements; t.osmBase = json.osm3s && json.osm3s.timestamp_osm_base;
      t.loadedAt = Date.now(); t.status = 'ok'; t.fromCache = false; scheduleRebuild();
      cachePut(key, { elements: t.elements, osmBase: t.osmBase, loadedAt: t.loadedAt }).catch(() => {});
    }).catch(err => { console.error(err); t.status = 'error'; t.error = String(err.message || err); })
      .finally(() => { running--; renderStatus(); pump(); });
  }
}

// Mały region (Gdynia) = jedno zapytanie. Duży (Polska) = kafle z10 w widoku.
function wantedTiles() {
  if (REGION.preload) return [{ key: 'region/' + REGION.bbox.join(','), bbox: REGION.bbox }];
  if (map.getZoom() < MIN_DATA_ZOOM) return [];
  const b = map.getBounds();
  const view = intersect([b.getSouth(), b.getWest(), b.getNorth(), b.getEast()], REGION.bbox);
  return view ? tilesFor(view).map(([x, y]) => ({ key: `${TILE_Z}/${x}/${y}`, bbox: intersect(tileBbox(x, y, TILE_Z), REGION.bbox) })).filter(t => t.bbox) : [];
}
function requestTiles(force = false) {
  for (const { key, bbox } of wantedTiles()) {
    if (!tiles.has(key)) {
      tiles.set(key, { bbox, status: 'new' });
      // najpierw pokaż najnowszą kopię: z przeglądarki (IndexedDB) albo snapshot z repo (data/<region>.json,
      // odświeżany co ~15 min przez GitHub Actions), potem odśwież na żywo z Overpass w tle
      Promise.all([cacheGet(key).catch(() => null), REGION.preload ? fetchSnapshot() : null]).then(([c, snap]) => {
        if (snap && (!c || Date.parse(snap.osmBase) > Date.parse(c.osmBase))) c = snap;
        const t = tiles.get(key);
        if (!c || t.elements) return;
        Object.assign(t, { elements: c.elements, osmBase: c.osmBase, loadedAt: c.loadedAt, fromCache: c === snap ? 'snapshot' : 'browser' });
        if (t.status === 'new') t.status = 'ok';
        scheduleRebuild();
        if (Date.now() - c.loadedAt > REFRESH_MS) enqueue(key);
      }).catch(() => {}).finally(() => { const t = tiles.get(key); if (t.status === 'new') enqueue(key); });
      continue;
    }
    const t = tiles.get(key);
    if (t.status === 'new' || t.status === 'error' || (force && t.status === 'ok') ||
        (t.status === 'ok' && Date.now() - t.loadedAt > REFRESH_MS)) enqueue(key);
  }
  renderStatus();
}

/* =========================================================================
   PRZETWARZANIE: relacje → odcinki z numerem „pasa” (slot) do offsetu
   ========================================================================= */
const KIND = { bicycle: 'bicycle', mtb: 'bicycle', hiking: 'hiking', foot: 'hiking', walking: 'hiking' };
const NET_RANK = { icn: 0, ncn: 1, rcn: 2, lcn: 3, iwn: 0, nwn: 1, rwn: 2, lwn: 3 };
const ROUTE_RANK = { bicycle: 0, mtb: 1, hiking: 2, foot: 3, walking: 4 };

function cssColor(c) {
  if (!c) return null; c = String(c).trim().toLowerCase();
  if (PTTK[c]) return PTTK[c];
  if (/^#?f{3}(f{3})?$/.test(c)) return PTTK.white; // biały szlak byłby niewidoczny
  if (/^[0-9a-f]{6}$/.test(c)) c = '#' + c;
  return (window.CSS && CSS.supports('color', c)) ? c : null;
}
function routeColor(tags) {
  const osmc = tags['osmc:symbol'] ? tags['osmc:symbol'].split(':')[0] : null;
  if (KIND[tags.route] === 'hiking') return cssColor(osmc) || cssColor(tags.colour) || PTTK.red;
  return cssColor(tags.colour) || cssColor(osmc) || BIKE_FALLBACK[tags.network] || '#6a1b9a';
}

// Ujednolicony kierunek odcinka (z grubsza „na wschód”), żeby offset
// sąsiednich odcinków tego samego szlaku wypadał po tej samej stronie.
function normalize(coords) {
  const a = coords[0], b = coords[coords.length - 1];
  const dx = (b[0] - a[0]) * Math.cos(a[1] * Math.PI / 180), dy = b[1] - a[1];
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  return (ang > 100 || ang <= -80) ? coords.slice().reverse() : coords;
}

// Zwraca listę elementów infrastruktury na drodze:
//   side: -1 lewa / 0 oś / 1 prawa (względem kierunku narysowania drogi w OSM)
//   dir:  kierunek dozwolonej jazdy rowerem: 1 zgodnie z drogą, -1 pod prąd, 2 oba (kontraruch), 0 brak strzałek (dwukierunkowa)
function infraClasses(t) {
  const out = []; const hw = t.highway; if (!hw) return out;
  const carDir = ['yes', '1', 'true'].includes(t.oneway) ? 1 : t.oneway === '-1' ? -1 : 0;
  const ow = v => v === 'yes' || v === '1' || v === 'true' ? 1 : v === '-1' ? -1 : v === 'no' ? 0 : null;
  // przejazd przez jezdnię: czerwony z białymi kwadratami jak malowany P-11
  if (t.cycleway === 'crossing' || (hw === 'cycleway' && (t.crossing || t.footway === 'crossing')) ||
      (t.footway === 'crossing' && t.bicycle === 'designated') || (t.path === 'crossing' && t.bicycle === 'designated')) {
    // przejazd połączony z przejściem dla pieszych (foot=designated / footway=crossing) dostaje obok „zebrę”
    out.push({ cls: 'przejazd', side: 0, dir: 0, zebra: t.foot === 'designated' || t.footway === 'crossing' || t.highway === 'footway' });
    return out;
  }
  if (hw === 'cycleway' || (t.bicycle === 'designated' && /^(path|footway|pedestrian|track|service|living_street|bridleway)$/.test(hw))) {
    const shared = hw === 'cycleway' ? (t.foot === 'designated' && t.segregated !== 'yes')
      : ((t.foot === 'designated' || hw === 'footway' || hw === 'pedestrian') && t.segregated !== 'yes');
    const d = ow(t['oneway:bicycle']) ?? ow(t.oneway) ?? 0;
    out.push({ cls: shared ? 'ciag' : 'droga', side: 0, dir: d });
    return out;
  }
  // cycleway=track (droga dla rowerów wzdłuż jezdni, zmapowana jako tag ulicy) = zwykła droga dla rowerów
  const map1 = v => ({ lane: 'pas', opposite_lane: 'kontrapas', track: 'droga', opposite_track: 'droga',
    share_busway: 'buspas', opposite_share_busway: 'buspas', shared_lane: 'sharrow', opposite: 'kontraruch' })[v];
  const push = (cls, sideNum, explicit) => {
    let dir;
    if (cls === 'kontraruch') dir = 2;
    else if (explicit !== null && explicit !== undefined) dir = explicit === 0 ? 0 : explicit; // tag cycleway:*:oneway
    else if (cls === 'kontrapas') dir = carDir ? -carDir : -1;
    else if (carDir) dir = carDir;
    else dir = sideNum < 0 ? -1 : sideNum > 0 ? 1 : 0; // ulica dwukierunkowa: ruch prawostronny
    out.push({ cls, side: sideNum, dir });
  };
  const sideVal = (side, v) => {
    let cls = map1(v); if (!cls) return;
    const explicit = ow(t[`cycleway:${side}:oneway`]);
    const contraLeft = side === 'left' && carDir && t['oneway:bicycle'] === 'no' && explicit === null;
    if (cls === 'pas' && carDir && (explicit === -carDir || contraLeft)) cls = 'kontrapas';
    // sierżant / buspas po lewej stronie jednokierunkowej, gdy rowery jadą pod prąd: kierunek przeciwny do ruchu aut
    const ex = (cls === 'sharrow' || cls === 'buspas') && contraLeft ? -carDir : explicit;
    push(cls, side === 'left' ? -1 : 1, cls === 'kontrapas' && explicit === null ? null : ex);
  };
  if (t['cycleway:left']) sideVal('left', t['cycleway:left']);
  if (t['cycleway:right']) sideVal('right', t['cycleway:right']);
  if (t['cycleway:both']) { sideVal('left', t['cycleway:both']); sideVal('right', t['cycleway:both']); }
  if (t.cycleway && !out.length) {
    const cls = map1(t.cycleway);
    if (cls) {
      if (/^opposite/.test(t.cycleway)) push(cls === 'pas' ? 'kontrapas' : cls, cls === 'kontraruch' ? 0 : -1, null);
      else if (carDir) push(cls, 1, null);
      else { push(cls, -1, null); push(cls, 1, null); }
    }
  }
  if (!out.length && carDir && t['oneway:bicycle'] === 'no') push('kontraruch', 0, null);
  return out;
}

const routesById = new Map(); // id → tags (dla panelu)
const waysById = new Map();
let rebuildTimer = null;
function scheduleRebuild() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 150); }

function rebuild() {
  const rels = new Map(), ways = new Map();
  for (const t of tiles.values()) {
    if (!t.elements) continue;
    for (const e of t.elements) {
      if (e.type === 'relation') rels.set(e.id, e);
      else if (e.type === 'way' && e.geometry) ways.set(e.id, e);
    }
  }
  routesById.clear(); waysById.clear();
  for (const [id, w] of ways) waysById.set(id, w);

  // stała kolejność szlaków (międzynarodowe → lokalne, potem id),
  // dzięki której ten sam szlak zwykle trzyma ten sam „pas” na kolejnych odcinkach
  const ordered = [...rels.values()].filter(r => KIND[r.tags.route]).sort((a, b) =>
    (ROUTE_RANK[a.tags.route] - ROUTE_RANK[b.tags.route]) ||
    ((NET_RANK[a.tags.network] ?? 9) - (NET_RANK[b.tags.network] ?? 9)) || (a.id - b.id));

  const onWay = new Map(); // wayId → [rel]
  for (const r of ordered) {
    routesById.set(r.id, r.tags);
    const seen = new Set();
    for (const m of r.members) {
      if (m.type !== 'way' || !ways.has(m.ref) || seen.has(m.ref)) continue;
      seen.add(m.ref);
      if (!onWay.has(m.ref)) onWay.set(m.ref, []);
      onWay.get(m.ref).push(r);
    }
  }

  const routeFeatures = [];
  for (const [wayId, list] of onWay) {
    const coords = normalize(ways.get(wayId).geometry.map(p => [p.lon, p.lat]));
    list.forEach((r, slot) => routeFeatures.push({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: coords },
      properties: { rel: r.id, way: wayId, kind: KIND[r.tags.route], color: routeColor(r.tags), slot, n: list.length,
        name: r.tags.name || r.tags.ref || `relacja ${r.id}` },
    }));
  }

  const infraFeatures = [], sideItems = [], signFeatures = [];
  const pointAlong = (c, m, cls) => {
    let acc = 0;
    for (let i = 1; i < c.length; i++) {
      const l = lineLength([c[i - 1], c[i]]);
      if (acc + l >= m) { const t = (m - acc) / l; return { type: 'Feature', geometry: { type: 'Point', coordinates: [c[i - 1][0] + (c[i][0] - c[i - 1][0]) * t, c[i - 1][1] + (c[i][1] - c[i - 1][1]) * t] }, properties: { cls, sign: 1, side: 0, dir: 0 } }; }
      acc += l;
    }
    return { type: 'Feature', geometry: { type: 'Point', coordinates: c[c.length - 1] }, properties: { cls, sign: 1, side: 0, dir: 0 } };
  };
  let infraLen = 0;
  for (const [wayId, w] of ways) {
    const classes = infraClasses(w.tags || {});
    if (!classes.length) continue;
    const coords = w.geometry.map(p => [p.lon, p.lat]);
    for (const c of classes) {
      const props = { way: wayId, cls: c.cls, side: c.side, dir: c.dir, color: INFRA[c.cls].color, w: INFRA[c.cls].width, wm: widthM(c.cls, w.tags), zebra: c.zebra ? 1 : 0 };
      if (c.side) sideItems.push({ coords, props, offM: laneOffsetM(w.tags) /* sierżant w tym samym miejscu co pas, bez skoku */, name: w.tags.name || w.tags.ref || '' });
      else infraFeatures.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: props });
      // znaki C-13 / C-13/16 przy końcach każdego odcinka DDR (tam, gdzie się na nią wjeżdża: za przejazdem,
      // na skrzyżowaniu, na łączeniu odcinków), 3 m od węzła; znaki bliżej niż 15 m od siebie scalamy niżej
      if (c.cls === 'droga' || c.cls === 'ciag') {
        const len = lineLength(coords);
        if (len >= 8) signFeatures.push(pointAlong(coords, 3, c.cls), pointAlong(coords.slice().reverse(), 3, c.cls));
        else if (len >= 4) signFeatures.push(pointAlong(coords, len / 2, c.cls));
      }
    }
    infraLen += lineLength(coords);
  }

  map.getSource('routes').setData({ type: 'FeatureCollection', features: routeFeatures });
  attachPathsToCrossingEnds(infraFeatures);
  infraFeatures.push(...buildLaneChains(sideItems, infraFeatures));
  // etykiety pasów i sierżantów: przy połączeniach odcinków OSM (początek, koniec, łączenia), jak znaki C-13
  for (const f of infraFeatures) {
    const j = f._joints; delete f._joints;
    if (!j || !/^(pas|kontrapas|sharrow)$/.test(f.properties.cls) || !f.properties.dir) continue;
    const c = f.geometry.coordinates, len = lineLength(c);
    if (len < 12) continue;
    for (const t of j) {
      const m = Math.min(len - 4, Math.max(4, t * len));
      const pf = pointAlong(c, m, f.properties.cls), q = pointAlong(c, Math.min(len, m + 1), f.properties.cls).geometry.coordinates, p0 = pointAlong(c, Math.max(0, m - 1), f.properties.cls).geometry.coordinates;
      const ang = Math.atan2(-(q[1] - p0[1]) * 110540, (q[0] - p0[0]) * 64650) * 180 / Math.PI + (f.properties.dir === -1 ? 180 : 0);
      pf.properties = { cls: f.properties.cls, sign: 2, side: 0, dir: 0, rot: ang };
      signFeatures.push(pf);
    }
  }
  const signs = [], sgrid = new Map(), cell = c => Math.floor(c[0] / 0.0004) + ':' + Math.floor(c[1] / 0.00025);
  for (const f of signFeatures) {
    const p = f.geometry.coordinates, [cx, cy] = cell(p).split(':').map(Number);
    let dup = false;
    for (let i = -1; i <= 1 && !dup; i++) for (let j = -1; j <= 1 && !dup; j++)
      dup = (sgrid.get((cx + i) + ':' + (cy + j)) || []).some(g => g.properties.cls === f.properties.cls && lineLength([g.geometry.coordinates, p]) < (f.properties.sign === 2 ? 25 : 15));
    if (dup) continue;
    signs.push(f);
    const k = cell(p); if (!sgrid.has(k)) sgrid.set(k, []); sgrid.get(k).push(f);
  }
  map.getSource('infra').setData({ type: 'FeatureCollection', features: infraFeatures.concat(signs) });
  stats = {
    bicycle: ordered.filter(r => KIND[r.tags.route] === 'bicycle').length,
    hiking: ordered.filter(r => KIND[r.tags.route] === 'hiking').length,
    infraKm: infraLen / 1000,
  };
  if (selectedRel) select(selectedRel, false);
  renderStatus();
}

// Pas rowerowy leży przy krawędzi jezdni, więc przesuwamy go w metrach od osi drogi:
// pół szerokości jezdni (z tagu width, z liczby pasów albo typowej dla klasy drogi) + pół szerokości pasa rowerowego.
const HALF_CARRIAGEWAY = { motorway: 5.5, trunk: 3.6, primary: 3.5, secondary: 3.3, tertiary: 3.1, unclassified: 2.8,
  residential: 2.8, living_street: 2.5, service: 2.2 };
// Rzeczywista szerokość elementu infrastruktury w metrach (tag width / cycleway:width albo wartość typowa).
const WIDTH_M = { droga: 2.0, ciag: 2.5, pas: 1.5, kontrapas: 1.5, kontraruch: 0.8, buspas: 1.2, sharrow: 0.8, przejazd: 2.0 };
function widthM(cls, t) { // jednolita szerokość dla klasy (tagi width dawały różnie grube DDR obok siebie)
  return WIDTH_M[cls];
}
function laneOffsetM(t) {
  const width = parseFloat(t.width);
  if (width > 3 && width < 40) return width / 2 - 0.75;
  const lanes = parseInt(t.lanes, 10);
  const half = lanes > 0 && lanes < 10 ? lanes * 1.55 : (HALF_CARRIAGEWAY[(t.highway || '').replace('_link', '')] || 2.8);
  return half + 0.8;
}
// Równoległe przesunięcie linii o d metrów (d > 0 w prawo od kierunku narysowania), z ograniczonym ścięciem narożników.
function offsetLine(coords, d) {
  const lat0 = coords[0][1] * Math.PI / 180, kx = Math.cos(lat0) * 111320, ky = 110540;
  const P = coords.map(([x, y]) => [x * kx, y * ky]);
  const out = [];
  for (let i = 0; i < P.length; i++) {
    const nrm = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dy / l, -dx / l]; };
    const n1 = i > 0 ? nrm(P[i - 1], P[i]) : null, n2 = i < P.length - 1 ? nrm(P[i], P[i + 1]) : null;
    let n = n1 && n2 ? [n1[0] + n2[0], n1[1] + n2[1]] : (n1 || n2);
    const l = Math.hypot(n[0], n[1]) || 1; n = [n[0] / l, n[1] / l];
    const cos = n1 && n2 ? Math.max(0.35, n[0] * n1[0] + n[1] * n1[1]) : 1;
    const di = Array.isArray(d) ? d[i] : d;
    out.push([(P[i][0] + n[0] * di / cos) / kx, (P[i][1] + n[1] * di / cos) / ky]);
  }
  return out;
}

// Pasy przy jezdni (pas, kontrapas, buspas, sierżant, droga wzdłuż jezdni) budujemy jako ciągi:
// 1) sąsiednie odcinki OSM tej samej ulicy z tym samym rodzajem pasa łączymy w jedną polilinię
//    (wspólny węzeł, zgodna strona i kierunek jazdy), więc nie ma przerw ani uskoków między odcinkami;
// 2) przesunięcie od osi liczymy w metrach dla każdego wierzchołka i wygładzamy (średnia w oknie ±12 m),
//    więc zmiana szerokości jezdni daje łagodne przejście zamiast schodka;
// 3) jeśli na końcu ciągu w osi ulicy zaczyna się droga dla rowerów / przejazd, przesunięcie maleje do zera
//    na ostatnich ~15 m, więc pas płynnie przechodzi w tę drogę.
const SMOOTH_M = 12, TAPER_M = 15;
function buildLaneChains(items, centerFeatures) {
  const lat0 = REGION.center[1] * Math.PI / 180, kx = Math.cos(lat0) * 111320, ky = 110540;
  const nodeKey = c => c[0].toFixed(7) + ',' + c[1].toFixed(7);
  const byNode = new Map();
  items.forEach((it, i) => {
    for (const end of [0, 1]) {
      const k = nodeKey(end ? it.coords[it.coords.length - 1] : it.coords[0]);
      if (!byNode.has(k)) byNode.set(k, []);
      byNode.get(k).push({ i, end });
    }
  });
  // węzły, w których kończy się albo przechodzi droga dla rowerów / ciąg / przejazd (do zbiegania offsetu)
  // węzeł → kierunki, w których wychodzi z niego droga dla rowerów / ciąg (tylko końce tych dróg)
  const pathNodes = new Map();
  const addDir = (node, next) => {
    const k = nodeKey(node), dx = (next[0] - node[0]) * kx, dy = (next[1] - node[1]) * ky, l = Math.hypot(dx, dy) || 1;
    if (!pathNodes.has(k)) pathNodes.set(k, []);
    pathNodes.get(k).push([dx / l, dy / l]);
  };
  for (const f of centerFeatures) if (/^(droga|ciag)$/.test(f.properties.cls)) {
    const c = f.geometry.coordinates;
    if (c.length > 1) { addDir(c[0], c[1]); addDir(c[c.length - 1], c[c.length - 2]); }
  }
  // zbiegamy do osi tylko, gdy droga dla rowerów wychodzi z końca pasa mniej więcej na wprost (≤ ~50°),
  // a nie gdy np. przecina ulicę w poprzek
  const continuesStraight = (end, prev) => {
    const dirs = pathNodes.get(nodeKey(end)); if (!dirs) return false;
    const dx = (end[0] - prev[0]) * kx, dy = (end[1] - prev[1]) * ky, l = Math.hypot(dx, dy) || 1;
    return dirs.some(d => (d[0] * dx + d[1] * dy) / l > 0.64);
  };

  const crossNodes = new Set(); // węzły leżące na przejazdach dla rowerów
  for (const f of centerFeatures) if (f.properties.cls === 'przejazd') for (const c of f.geometry.coordinates) crossNodes.add(nodeKey(c));
  // położenia (ułamek długości) połączeń odcinków OSM w ciągu – tam stawiamy etykiety pasa / sierżanta
  const jointFractions = (chain, pts) => {
    const keys = new Set(chain.slice(1).map(c => { const cp = items[c.i].coords; return nodeKey(c.rev ? cp[cp.length - 1] : cp[0]); }));
    const d = [0];
    for (let j = 1; j < pts.length; j++) d.push(d[j - 1] + Math.hypot((pts[j][0] - pts[j - 1][0]) * kx, (pts[j][1] - pts[j - 1][1]) * ky));
    const tot = d[d.length - 1] || 1, fr = [0];
    for (let j = 1; j < pts.length - 1; j++) if (keys.has(nodeKey(pts[j]))) fr.push(d[j] / tot);
    fr.push(1);
    return fr;
  };
  const used = new Set(), out = [];
  const segDir = (a, b) => { const dx = (b[0] - a[0]) * kx, dy = (b[1] - a[1]) * ky, l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  // przedłużanie ciągu: na końcu `tip` (ostatni wierzchołek w orientacji ciągu) szukamy odcinka zgodnego
  const extend = (chain, forward) => {
    for (;;) {
      const last = forward ? chain[chain.length - 1] : chain[0];
      const it = items[last.i];
      const pts = last.rev ? it.coords.slice().reverse() : it.coords;
      const tip = forward ? pts[pts.length - 1] : pts[0];
      const inDir = forward ? segDir(pts[pts.length - 2], tip) : segDir(pts[1], tip);
      const side = it.props.side * (last.rev ? -1 : 1), dir = it.props.dir === 2 || !it.props.dir ? it.props.dir : it.props.dir * (last.rev ? -1 : 1);
      let best = null, bestCos = 0.3;
      for (const cand of byNode.get(nodeKey(tip)) || []) {
        if (used.has(cand.i)) continue;
        const ci = items[cand.i];
        if (ci.props.cls !== it.props.cls || ci.name !== it.name) continue;
        // forward: kandydat zaczyna się w tip (end 0) → bez odwracania; kończy się w tip (end 1) → odwracamy
        const rev = forward ? cand.end === 1 : cand.end === 0;
        const cSide = ci.props.side * (rev ? -1 : 1);
        const cDir = ci.props.dir === 2 || !ci.props.dir ? ci.props.dir : ci.props.dir * (rev ? -1 : 1);
        if (cSide !== side || cDir !== dir) continue;
        const cp = rev ? ci.coords.slice().reverse() : ci.coords;
        const outDir = forward ? segDir(tip, cp[1]) : segDir(tip, cp[cp.length - 2]);
        // obie strony: inDir i outDir wskazują „dalej” od ciągu, więc prosta kontynuacja ma cos ≈ 1 (nie zawracamy)
        const cos = inDir[0] * outDir[0] + inDir[1] * outDir[1];
        if (cos > bestCos) { bestCos = cos; best = { i: cand.i, rev }; }
      }
      if (!best) return;
      used.add(best.i);
      if (forward) chain.push(best); else chain.unshift(best);
    }
  };

  items.forEach((it, i) => {
    if (used.has(i)) return;
    used.add(i);
    const chain = [{ i, rev: false }];
    extend(chain, true); extend(chain, false);
    // krótkie końcówki pasa za przejazdem (np. 4 m odcinka ulicy w środku skrzyżowania) odcinamy,
    // a pojedyncze ogryzki pasa krótsze niż 8 m bez przedłużenia w ogóle nie rysujemy
    const itemLen = c => { const p = items[c.i].coords; let l = 0; for (let j = 1; j < p.length; j++) l += Math.hypot((p[j][0] - p[j - 1][0]) * kx, (p[j][1] - p[j - 1][1]) * ky); return l; };
    const joint = (a, b) => { const pa = items[a.i].coords, pts2 = a.rev ? pa[0] : pa[pa.length - 1]; return nodeKey(pts2); };
    while (chain.length > 1 && itemLen(chain[chain.length - 1]) < 8 && crossNodes.has(joint(chain[chain.length - 2], chain[chain.length - 1]))) chain.pop();
    while (chain.length > 1 && itemLen(chain[0]) < 8 && crossNodes.has(joint(chain[0], chain[1]))) chain.shift();
    if (it.props.cls !== 'sharrow' && chain.reduce((s2, c) => s2 + itemLen(c), 0) < 8) return;
    // polilinia w osi + przesunięcie (ze znakiem strony) dla każdego odcinka
    const pts = [], segOff = [];
    chain.forEach((c, n) => {
      const ci = items[c.i], cp = c.rev ? ci.coords.slice().reverse() : ci.coords;
      const off = ci.offM * ci.props.side * (c.rev ? -1 : 1);
      cp.forEach((p, j) => { if (n > 0 && j === 0) return; pts.push(p); if (pts.length > 1) segOff.push(off); });
    });
    if (pts.length < 2) return;
    // Pas nie przechodzi przez przejazd dla rowerów: jeśli za przejazdem zostaje tylko krótka końcówka
    // (< 15 m, np. kawałek ulicy do węzła z DDR), ucinamy ją i kończymy pas płasko tuż przed przejazdem.
    const flat = [false, false];
    const cutAtCrossing = (fromEnd) => {
      const n = pts.length; let acc = 0;
      for (let k = 1; k < n - 1; k++) {
        const j = fromEnd ? n - 1 - k : k, jPrev = fromEnd ? j + 1 : j - 1;
        acc += Math.hypot((pts[j][0] - pts[jPrev][0]) * kx, (pts[j][1] - pts[jPrev][1]) * ky);
        if (acc > 15) return;
        if (!crossNodes.has(nodeKey(pts[j]))) continue;
        // punkt 1,5 m przed przejazdem (połowa szerokości przejazdu + zapas)
        const q = fromEnd ? pts[j - 1] : pts[j + 1], L = Math.hypot((q[0] - pts[j][0]) * kx, (q[1] - pts[j][1]) * ky);
        const t = L > 2.5 ? 1.5 / L : 0, cutP = [pts[j][0] + (q[0] - pts[j][0]) * t, pts[j][1] + (q[1] - pts[j][1]) * t];
        if (fromEnd) { pts.splice(j, Infinity, cutP); segOff.splice(j); }   // segmenty 0..j-1, ostatni kończy się w cutP
        else { pts.splice(0, j + 1, cutP); segOff.splice(0, j); }            // pierwszy segment zaczyna się w cutP
        flat[fromEnd ? 1 : 0] = true;
        return;
      }
    };
    cutAtCrossing(false); cutAtCrossing(true);
    // Końcówka pasa/sierżanta wjeżdżająca w skrzyżowanie: jeśli w węźle osi ≤ 25 m przed końcem kończy się
    // droga dla rowerów (zjazd z DDR na jezdnię), a koniec ciągu to węzeł skrzyżowania, ucinamy ciąg na tym węźle.
    const cutAtPathNode = (fromEnd) => {
      const n = pts.length, endK = nodeKey(pts[fromEnd ? n - 1 : 0]);
      if ((byNode.get(endK) || []).length < 2) return;           // koniec nie jest węzłem z innymi pasami
      let acc = 0;
      for (let k = 1; k < n - 1; k++) {
        const j = fromEnd ? n - 1 - k : k, jPrev = fromEnd ? j + 1 : j - 1;
        acc += Math.hypot((pts[j][0] - pts[jPrev][0]) * kx, (pts[j][1] - pts[jPrev][1]) * ky);
        if (acc > 25) return;
        if (!pathNodes.has(nodeKey(pts[j]))) continue;
        if (fromEnd) { pts.splice(j + 1); segOff.splice(j); } else { pts.splice(0, j); segOff.splice(0, j); }
        return;
      }
    };
    if (!flat[1]) cutAtPathNode(true);
    if (!flat[0]) cutAtPathNode(false);
    if (pts.length < 2) return;
    // zagęszczenie co ≤ 6 m, żeby wygładzenie i zbieganie offsetu miały na czym działać
    const P = [], O = [];
    for (let j = 0; j < pts.length - 1; j++) {
      const a = pts[j], b = pts[j + 1], len = Math.hypot((b[0] - a[0]) * kx, (b[1] - a[1]) * ky), n = Math.max(1, Math.ceil(len / 6));
      for (let t = 0; t < n; t++) { P.push([a[0] + (b[0] - a[0]) * t / n, a[1] + (b[1] - a[1]) * t / n]); O.push(segOff[j]); }
    }
    P.push(pts[pts.length - 1]); O.push(segOff[segOff.length - 1]);
    const S = [0];
    for (let j = 1; j < P.length; j++) S.push(S[j - 1] + Math.hypot((P[j][0] - P[j - 1][0]) * kx, (P[j][1] - P[j - 1][1]) * ky));
    const total = S[S.length - 1];
    // wygładzenie: średnia offsetu segmentów w oknie ±SMOOTH_M (ważona długością)
    const D = P.map((_, j) => {
      let sum = 0, wsum = 0;
      for (let k = 0; k < P.length - 1; k++) {
        const lo = Math.max(S[k], S[j] - SMOOTH_M), hi = Math.min(S[k + 1], S[j] + SMOOTH_M);
        if (hi > lo) { sum += O[k] * (hi - lo); wsum += hi - lo; }
      }
      return wsum ? sum / wsum : O[Math.min(j, O.length - 1)];
    });
    // zbieganie do osi na końcach, przy których zaczyna się droga dla rowerów / przejazd
    const taperStart = false, taperEnd = false; // zbieganie do osi wyłączone (dawało kliny i krzyżujące się pasy)
    const tl = Math.min(TAPER_M, total / 3);
    for (let j = 0; j < P.length; j++) {
      let f = 1;
      if (taperStart && S[j] < tl) f = Math.min(f, S[j] / tl);
      if (taperEnd && total - S[j] < tl) f = Math.min(f, (total - S[j]) / tl);
      D[j] *= f * f * (3 - 2 * f); // gładki (smoothstep) zanik
    }
    const first = items[chain[0].i].props;
    const side = first.side * (chain[0].rev ? -1 : 1);
    const dir = first.dir === 2 || !first.dir ? first.dir : first.dir * (chain[0].rev ? -1 : 1);
    out.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: offsetLine(P, D) },
      properties: { ...first, side, dir, ways: chain.map(c => items[c.i].props.way).join(',') },
      _axis: [[P[0], P[1]], [P[P.length - 1], P[P.length - 2]]], _flat: flat, _joints: jointFractions(chain, pts) }); // oś jezdni na końcach (do lejka pas → DDR)
  });
  joinLanesToPaths(out, centerFeatures, kx, ky);
  return out;
}

// Płynne przejście pasa w drogę dla rowerów: krótka krzywa Béziera styczna do końca pasa i do początku
// drogi dla rowerów. Dodawana tylko, gdy przejdzie walidację; inaczej pas kończy się płasko.
//   - koniec drogi dla rowerów leży ≤ 25 m od końca pasa, „przed” nim (odchylenie < 45°),
//   - droga dla rowerów wychodzi w kierunku zbliżonym do pasa (zakręt < 75°),
//   - krzywa się nie cofa i nie przecina żadnego pasa (także drugiego pasa tej ulicy).
function joinLanesToPaths(lanes, centerFeatures, kx, ky) {
  const xy = c => [c[0] * kx, c[1] * ky], ll = p => [p[0] / kx, p[1] / ky];
  const extra = [];
  // pts: łuk od końca pasa do DDR (xy). Łuk rysujemy kolorem pasa; ostatnie ~3 m to krótkie
  // rozszerzenie w kolorze DDR (kolor zmienia się od razu, szerokość płynnie, liniowo).
  const RAMP_M = 3;
  const transition = (lp, dp, pts) => {
    const dflt = q => (q.color && q.w && q.wm ? q : { ...q, color: INFRA[q.cls].color, w: INFRA[q.cls].width, wm: widthM(q.cls, {}) });
    lp = dflt(lp); dp = dflt(dp);
    const S = [0];
    for (let k = 1; k < pts.length; k++) S.push(S[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    const total = S[S.length - 1], ramp = Math.min(RAMP_M, total / 2), at = d => {
      let k = 1; while (k < S.length - 1 && S[k] < d) k++;
      const t = (d - S[k - 1]) / ((S[k] - S[k - 1]) || 1);
      return [pts[k - 1][0] + (pts[k][0] - pts[k - 1][0]) * t, pts[k - 1][1] + (pts[k][1] - pts[k - 1][1]) * t];
    };
    const split = total - ramp;
    const tail = [...pts.slice(1).filter((_, k) => S[k + 1] < split), at(split)];
    const pieces = [], n = 4;
    for (let k = 0; k < n; k++) {
      const d0 = split + ramp * k / n, d1 = split + ramp * (k + 1) / n, e = (k + 1) / n;
      const seg = [at(d0), ...pts.filter((_, j) => S[j] > d0 && S[j] < d1), at(d1)];
      pieces.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: seg.map(ll) },
        properties: { ...lp, cls: 'przejscie', side: 0, dir: 0, color: dp.color,
          w: lp.w + (dp.w - lp.w) * e, wm: lp.wm + (dp.wm - lp.wm) * e } });
    }
    return { tail, pieces };
  };
  const norm = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
  // 1) Lejek: droga dla rowerów zaczyna się w węźle osi jezdni, w którym kończy się pas (typowe mapowanie
  //    zjazdu z pasa na DDR). Odcinek DDR leżący na jezdni (bliżej osi niż pas) chowamy, a pas prowadzimy
  //    prostą, gładką linią do miejsca, gdzie DDR schodzi z jezdni – bez zawijasów w środku skrzyżowania.
  const pathEnds = new Map(), nk = c => c[0].toFixed(7) + ',' + c[1].toFixed(7);
  for (const f of centerFeatures) if (/^(droga|ciag)$/.test(f.properties.cls) && f.geometry.coordinates.length > 1) {
    const c = f.geometry.coordinates;
    for (const atStart of [true, false]) {
      const k = nk(atStart ? c[0] : c[c.length - 1]);
      if (!pathEnds.has(k)) pathEnds.set(k, []);
      pathEnds.get(k).push({ f, atStart });
    }
  }
  const done = new Set(), pathEndRefs = [...pathEnds.values()].flat();
  const endOf = pe => { // aktualny koniec DDR (po ewentualnym przycięciu) i kierunek w głąb DDR
    const c = pe.f.geometry.coordinates, p = xy(pe.atStart ? c[0] : c[c.length - 1]), q = xy(pe.atStart ? c[1] : c[c.length - 2]);
    return { p, u: norm([q[0] - p[0], q[1] - p[1]]) };
  };
  for (const f of lanes) {
    if (!f._axis || !/^(pas|kontrapas|buspas|sharrow)$/.test(f.properties.cls)) continue;
    for (const atStart of [true, false]) {
      const c = f.geometry.coordinates;
      if (f._flat[atStart ? 0 : 1]) { done.add(f.properties.ways + ':' + atStart); continue; } // przy przejeździe: płaski koniec
      const [Nll, Mll] = f._axis[atStart ? 0 : 1];
      const cands = pathEnds.get(nk(Nll)) || [];
      const N = xy(Nll), M = xy(Mll), E = xy(atStart ? c[0] : c[c.length - 1]);
      const a = norm([N[0] - M[0], N[1] - M[1]]);                 // kierunek jazdy „w stronę końca”
      let nrm = [-a[1], a[0]];
      let offE = (E[0] - N[0]) * nrm[0] + (E[1] - N[1]) * nrm[1];
      if (offE < 0) { nrm = [-nrm[0], -nrm[1]]; offE = -offE; }
      if (offE < 0.5) continue;
      const sd = p => (p[0] - N[0]) * nrm[0] + (p[1] - N[1]) * nrm[1];
      // DDR, która od węzła schodzi na stronę pasa i dalej do przodu (nie wraca wzdłuż pasa)
      let best = null;
      for (const pe of cands) {
        const pc = pe.f.geometry.coordinates.map(xy); if (!pe.atStart) pc.reverse();
        let acc = 0;
        for (let i = 1; i < pc.length && acc < 40; i++) {
          const p = pc[i - 1], q = pc[i], sp = sd(p), sq = sd(q);
          acc += Math.hypot(q[0] - p[0], q[1] - p[1]);
          if (sq >= offE && sp < offE) {
            const t = (offE - sp) / (sq - sp), S = [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
            const fwd = (S[0] - N[0]) * a[0] + (S[1] - N[1]) * a[1];
            if (fwd > -3 && (!best || acc < best.acc)) best = { pe, pc, i, S, acc, out: norm([q[0] - p[0], q[1] - p[1]]) };
            break;
          }
        }
      }
      if (best) {
        // przytnij DDR do punktu zejścia z jezdni
        const rest = [best.S, ...best.pc.slice(best.i)].map(ll);
        best.pe.f.geometry.coordinates = best.pe.atStart ? rest : rest.reverse();
      } else {
        // DDR nie zaczyna się w węźle jezdni, ale jej koniec leży tuż obok, po stronie pasa
        // (np. 5 m za końcem pasa): pas dociągamy do tego końca, stycznie do kierunku DDR
        for (const near of pathEndRefs.map(pe => ({ ...endOf(pe), pe }))) {
          const P = near.p, dE = Math.hypot(P[0] - E[0], P[1] - E[1]);
          if (dE > 20) continue;
          const side = sd(P), fwd = (P[0] - N[0]) * a[0] + (P[1] - N[1]) * a[1];
          if (side < offE * 0.6 || side > offE + 8 || fwd < -25 || fwd > 12) continue;
          if (near.u[0] * a[0] + near.u[1] * a[1] < 0.5) continue;      // DDR biegnie dalej w tę stronę co pas
          if (!best || dE < best.acc) best = { S: P, out: near.u, acc: dE, pe: near.pe };
        }
        if (!best) continue;
      }
      // pas: cofnij koniec, aż linia do S będzie łagodna (≤ ~20° od kierunku pasa), maks. 30 m
      const L = c.map(xy); if (atStart) L.reverse();               // L kończy się na końcu pasa
      let cut = L.length - 1, back = 0;
      const dS = Math.hypot(best.S[0] - E[0], best.S[1] - E[1]);
      while (cut > 1) {
        const P = L[cut], Q = L[cut - 1], t = norm([P[0] - Q[0], P[1] - Q[1]]);
        const v = [best.S[0] - P[0], best.S[1] - P[1]], d = Math.hypot(v[0], v[1]);
        if ((v[0] * t[0] + v[1] * t[1]) / d >= 0.94 && back >= Math.min(8, dS)) break;
        back += Math.hypot(P[0] - Q[0], P[1] - Q[1]);
        if (back > 30) break;
        cut--;
      }
      // prosty, płaski skos od pasa do DDR (bez łuku, który dawał „banany”)
      const P0 = L[cut], t0 = norm([P0[0] - L[cut - 1][0], P0[1] - L[cut - 1][1]]), P3 = best.S;
      const curve = [];
      for (let k = 1; k <= 10; k++) curve.push([P0[0] + (P3[0] - P0[0]) * k / 10, P0[1] + (P3[1] - P0[1]) * k / 10]);
      let ok = true, prevProj = 0;
      for (const q of curve) { const pr = (q[0] - P0[0]) * t0[0] + (q[1] - P0[1]) * t0[1]; if (pr < prevProj - 0.05) { ok = false; break; } prevProj = pr; }
      const tr = ok ? transition(f.properties, best.pe.f.properties, [P0, ...curve]) : null;
      const NL = [...L.slice(0, cut + 1), ...(ok ? tr.tail : [P3])].map(ll);
      f.geometry.coordinates = atStart ? NL.reverse() : NL;
      if (ok) extra.push(...tr.pieces);
      done.add(f.properties.ways + ':' + atStart);
    }
  }
  // (ogólne łuki do dowolnego punktu DDR wyłączone: łączyły pasy przez skrzyżowania; pas bez DDR w węźle kończy się płasko)
  // 2) Pas ↔ sierżant w tym samym węźle osi: szerokość zmienia się płynnie na ostatnich ~4 m pasa
  const axisEnds = new Map();
  for (const f of lanes) if (f._axis && f.geometry.coordinates.length > 1) for (const atStart of [true, false]) {
    const k = nk(f._axis[atStart ? 0 : 1][0]);
    if (!axisEnds.has(k)) axisEnds.set(k, []);
    axisEnds.get(k).push({ f, atStart });
  }
  for (const list of axisEnds.values()) for (const a of list) {
    if (!/^(pas|kontrapas|buspas)$/.test(a.f.properties.cls)) continue;
    const ca = a.f.geometry.coordinates, Ea = xy(a.atStart ? ca[0] : ca[ca.length - 1]);
    const b = list.find(o => o.f.properties.cls === 'sharrow' && (() => {
      const cb = o.f.geometry.coordinates, Eb = xy(o.atStart ? cb[0] : cb[cb.length - 1]);
      return Math.hypot(Eb[0] - Ea[0], Eb[1] - Ea[1]) < 2;
    })());
    if (!b) continue;
    const L = ca.map(xy); if (a.atStart) L.reverse();               // L kończy się na styku z sierżantem
    let back = 0, k = L.length - 1;
    while (k > 1 && back < 5) { back += Math.hypot(L[k][0] - L[k - 1][0], L[k][1] - L[k - 1][1]); k--; }
    const seg = L.slice(k);                                          // ostatnie ~5 m pasa
    if (seg.length < 2) continue;
    const lp = a.f.properties, sp = b.f.properties, n = 6, S = [0];
    for (let i = 1; i < seg.length; i++) S.push(S[i - 1] + Math.hypot(seg[i][0] - seg[i - 1][0], seg[i][1] - seg[i - 1][1]));
    const tot = S[S.length - 1], at = d => { let i = 1; while (i < S.length - 1 && S[i] < d) i++; const t = (d - S[i - 1]) / ((S[i] - S[i - 1]) || 1); return [seg[i - 1][0] + (seg[i][0] - seg[i - 1][0]) * t, seg[i - 1][1] + (seg[i][1] - seg[i - 1][1]) * t]; };
    for (let i = 0; i < n; i++) {
      const d0 = tot * i / n, d1 = tot * (i + 1) / n, e = (i + 0.5) / n;
      extra.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [at(d0), ...seg.filter((_, j) => S[j] > d0 && S[j] < d1), at(d1)].map(ll) },
        properties: { ...lp, cls: 'przejscie', side: 0, dir: 0, w: lp.w + (sp.w - lp.w) * e, wm: lp.wm + (sp.wm - lp.wm) * e } });
    }
    const keep = L.slice(0, k + 1).map(ll);
    a.f.geometry.coordinates = a.atStart ? keep.reverse() : keep;
  }
  for (const f of lanes) { delete f._axis; delete f._flat; }
  lanes.push(...extra);
}

// Droga dla rowerów kończąca się w środku przejazdu (na węźle osi jezdni) jest w OSM „wciągnięta” na jezdnię.
// Rysujemy ją tak, jak wygląda w terenie: ostatnie wierzchołki leżące nad jezdnią pomijamy, a DDR dochodzi
// do najbliższego końca przejazdu (po swojej stronie).
function attachPathsToCrossingEnds(features) {
  const lat0 = REGION.center[1] * Math.PI / 180, kx = Math.cos(lat0) * 111320, ky = 110540;
  const key = c => c[0].toFixed(7) + ',' + c[1].toFixed(7);
  const inner = new Map(); // węzeł wewnętrzny przejazdu → przejazd
  for (const f of features) if (f.properties.cls === 'przejazd') {
    const c = f.geometry.coordinates;
    for (let i = 1; i < c.length - 1; i++) inner.set(key(c[i]), c);
  }
  for (const f of features) if (/^(droga|ciag)$/.test(f.properties.cls)) {
    for (const atStart of [true, false]) {
      let c = f.geometry.coordinates;
      const N = atStart ? c[0] : c[c.length - 1], cr = inner.get(key(N));
      if (!cr || c.length < 2) continue;
      const pts = atStart ? c.slice() : c.slice().reverse();    // pts[0] = węzeł w przejeździe
      const P = p => [(p[0] - N[0]) * kx, (p[1] - N[1]) * ky];
      // koniec przejazdu po stronie, z której przychodzi DDR
      const prev = P(pts[1]);
      let best = null;
      for (const C of [cr[0], cr[cr.length - 1]]) {
        const v = P(C), L = Math.hypot(v[0], v[1]) || 1, u = [v[0] / L, v[1] / L];
        const proj = prev[0] * u[0] + prev[1] * u[1];
        if (proj > 0 && (!best || proj / L > best.score)) best = { C, u, L, score: proj / L };
      }
      if (!best) continue;
      let k = 1;
      // pomijamy wierzchołki leżące praktycznie na linii przejazdu (< 2,5 m od niej)
      while (k < pts.length - 1) { const v = P(pts[k]); if (Math.abs(v[0] * best.u[1] - v[1] * best.u[0]) >= 2.5) break; k++; }
      const np = [best.C, ...pts.slice(k)];
      f.geometry.coordinates = atStart ? np : np.reverse();
    }
  }
}

function lineLength(c) {
  let s = 0;
  for (let i = 1; i < c.length; i++) {
    const [x1, y1] = c[i - 1], [x2, y2] = c[i];
    const dx = (x2 - x1) * Math.cos((y1 + y2) / 2 * Math.PI / 180) * 111320, dy = (y2 - y1) * 110540;
    s += Math.hypot(dx, dy);
  }
  return s;
}

/* =========================================================================
   MAPA
   ========================================================================= */
const style = { version: 8, sources: {}, layers: [] };
for (const b of BASEMAPS) {
  style.sources[b.id] = { type: 'raster', tiles: b.tiles, tileSize: b.tiles[0].startsWith('retry://') ? 512 : 256, maxzoom: b.max, attribution: b.attr };
  style.layers.push({ id: 'base-' + b.id, type: 'raster', source: b.id, layout: { visibility: b.id === DEFAULT_BASE ? 'visible' : 'none' } });
}
style.sources.hillshade = { type: 'raster', tiles: HILLSHADE_TILES, tileSize: 512, minzoom: 6, maxzoom: 19,
  attribution: 'Cieniowanie NMT ISOK © <a href="https://www.geoportal.gov.pl">GUGiK</a>' };
style.layers.push({ id: 'hillshade', type: 'raster', source: 'hillshade', paint: { 'raster-opacity': 0.35 } });

const map = new maplibregl.Map({
  container: 'map', style, center: REGION.center, zoom: REGION.zoom, minZoom: 5, maxZoom: 19,
  hash: true, attributionControl: { compact: false },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
let stats = null, selectedRel = null;

// Offset rośnie z numerem pasa (slot) i ze zoomem.
const z = (pairs) => ['interpolate', ['linear'], ['zoom'], ...pairs.flat()];
const ROUTE_WIDTH = z([[10, 1.4], [13, 2.4], [16, 3.6], [19, 6]]);
const ROUTE_OFFSET = z([
  [10, ['*', ['+', ['get', 'slot'], 1], 2.2]],
  [13, ['*', ['+', ['get', 'slot'], 1], 3.4]],
  [16, ['*', ['+', ['get', 'slot'], 1], 5.2]],
  [19, ['*', ['+', ['get', 'slot'], 1], 8.5]],

  map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] },
    attribution: 'Szlaki i drogi rowerowe: © OpenStreetMap (ODbL) via Overpass API' });
  map.addSource('infra', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

  // infrastruktura (pod szlakami); pasy po stronie jezdni wg tagów left/right
  addInfraImages();
  const INFRA_OFFSET = 0; // pasy przy jezdni są już przesunięte w geometrii (w metrach, patrz offsetLine)
  // Szerokość: do zoomu 16 stylizowana (w px), od 17 rzeczywista szerokość w metrach (właściwość wm),
  // żeby na dużym zoomie droga dla rowerów i przejazd miały naturalną, tę samą szerokość co na ortofotomapie.
  const PX_PER_M = z => 2 ** z / 45441; // MapLibre (kafle 512 px) na szerokości ~54,5°
  const INFRA_WIDTH = (k = 1, add = 0) => {
    const stop = e => (add ? ['+', ['*', e, k], add] : ['*', e, k]);
    return ['interpolate', ['exponential', 2], ['zoom'],
      11, stop(['*', ['get', 'w'], 0.4]), 14, stop(['*', ['get', 'w'], 0.6]), 16, stop(['*', ['get', 'w'], 0.8]),
      17, stop(['max', ['*', ['get', 'w'], 0.9], ['*', ['get', 'wm'], PX_PER_M(17) * 0.85]]),
      22, stop(['*', ['get', 'wm'], PX_PER_M(22) * 0.85])];
  };
  const isCls = (...c) => ['in', ['get', 'cls'], ['literal', c]];
  // „krawężnik”: cienka szara obwódka wokół dróg dla rowerów i ciągów

  const NOT_SPECIAL = ['!', isCls('przejazd', ...Object.keys(INFRA).filter(k => INFRA[k].dash))];
  map.addLayer({ id: 'infra', type: 'line', source: 'infra', minzoom: 11,
    filter: ['all', NOT_SPECIAL, ['==', ['get', 'side'], 0]],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': ['get', 'color'], 'line-width': INFRA_WIDTH(), 'line-offset': INFRA_OFFSET } });
  // pasy przy jezdni: płaskie zakończenia (wyglądają jak pas, nie jak kreska)
  map.addLayer({ id: 'infra-lanes', type: 'line', source: 'infra', minzoom: 11,
    filter: ['all', NOT_SPECIAL, ['!=', ['get', 'side'], 0]],
    layout: { 'line-cap': 'butt', 'line-join': 'round' },
    paint: { 'line-color': ['get', 'color'], 'line-width': INFRA_WIDTH(), 'line-offset': INFRA_OFFSET } });
  for (const k of Object.keys(INFRA).filter(k => INFRA[k].dash)) {
    map.addLayer({ id: 'infra-' + k, type: 'line', source: 'infra', minzoom: 12, filter: isCls(k),
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: { 'line-color': ['get', 'color'], 'line-width': INFRA_WIDTH(), 'line-offset': INFRA_OFFSET,
        // od zoomu 17 kontrapas wygląda jak pas (pełne niebieskie wypełnienie + malowane linie), niżej przerywany
        'line-dasharray': k === 'kontrapas' ? ['step', ['zoom'], ['literal', INFRA[k].dash], 17, ['literal', [1, 0]]] : INFRA[k].dash } });
  }
  // przejazdy: szeroka czerwona linia + po obu brzegach białe kwadraciki
  const CROSS_W = INFRA_WIDTH();
  map.addLayer({ id: 'infra-przejazd', type: 'line', source: 'infra', minzoom: 14, filter: isCls('przejazd'),
    layout: { 'line-cap': 'butt' }, paint: { 'line-color': INFRA.przejazd.color, 'line-width': CROSS_W } }, 'infra-casing'); // pod drogami dla rowerów
  // zebra obok przejazdu: białe pasy ~0,5 m (wzór przerywania liczony w szerokościach linii)
  map.addLayer({ id: 'infra-zebra', type: 'line', source: 'infra', minzoom: 16, filter: ['all', isCls('przejazd'), ['==', ['get', 'zebra'], 1]],
    layout: { 'line-cap': 'butt' },
    paint: { 'line-color': '#ffffff', 'line-opacity': 0.95, 'line-width': INFRA_WIDTH(1.5), 'line-offset': INFRA_WIDTH(1.3), 'line-dasharray': [0.17, 0.17] } }, 'infra-przejazd');
  for (const sgn of [1, -1]) {
    map.addLayer({ id: 'infra-przejazd-sq' + (sgn > 0 ? 'R' : 'L'), type: 'line', source: 'infra', minzoom: 15.5, filter: isCls('przejazd'),
      layout: { 'line-cap': 'butt' },
      paint: { 'line-color': '#ffffff', 'line-dasharray': [1, 1],
        'line-width': INFRA_WIDTH(0.2), 'line-offset': INFRA_WIDTH(sgn * 0.4) } }, 'infra-casing');
  }
  // strzałki kierunku (wszędzie, gdzie jazda rowerem jest jednokierunkowa, i dwustronne na kontraruchu)
  // Pasy rowerowe na dużym zoomie jak w rzeczywistości: niebieskie wypełnienie o szerokości ~1,5 m,
  // przerywana biała linia od strony pasa ruchu, ciągła od krawężnika, malowany rower ze strzałką.
  const LANE = isCls('pas', 'kontrapas');
  const sideTimes = (k) => ['interpolate', ['exponential', 2], ['zoom'], 17, ['*', ['get', 'side'], ['*', ['get', 'wm'], PX_PER_M(17) * 0.85 * k]],
    22, ['*', ['get', 'side'], ['*', ['get', 'wm'], PX_PER_M(22) * 0.85 * k]]];
  const markW = m => ['interpolate', ['exponential', 2], ['zoom'], 17, Math.max(1, m * PX_PER_M(17)), 22, m * PX_PER_M(22)];
  const DASH_W = markW(0.22); // linie przerywane po obu stronach pasa, 22 cm

  map.addLayer({ id: 'infra-lane-out', type: 'line', source: 'infra', minzoom: 17, filter: LANE,
    layout: { 'line-cap': 'butt', 'line-join': 'round' },
    paint: { 'line-color': '#ffffff', 'line-width': DASH_W, 'line-offset': sideTimes(0.5), 'line-dasharray': [6, 6] } }); // przerywana po obu stronach pasa
  map.addLayer({ id: 'infra-lane-sym', type: 'symbol', source: 'infra', minzoom: 15, filter: ['all', ['==', ['get', 'sign'], 2], LANE],
    layout: {
      'symbol-placement': 'point', 'icon-rotation-alignment': 'map', 'icon-padding': 1,
      'icon-image': 'lanebike', 'icon-rotate': ['get', 'rot'],
      'icon-size': ['interpolate', ['exponential', 2], ['zoom'], 15, 0.55, 18, 0.9, 22, 2.6 * PX_PER_M(22) / 34],
    } });
  // zwykłe strzałki: na pasach tylko do zoomu 17 (wyżej jest malowany rower ze strzałką)
  map.addLayer({ id: 'infra-arrows', type: 'symbol', source: 'infra', minzoom: 15,
    filter: ['all', ['!=', ['get', 'dir'], 0], ['!', isCls('sharrow')], ['!', LANE]],
    layout: {
      'symbol-placement': 'line', 'symbol-spacing': 110, 'icon-rotation-alignment': 'map', 'icon-padding': 1,
      'icon-image': ['case', ['==', ['get', 'dir'], 2], 'arrow2', 'arrow'],
      'icon-rotate': ['case', ['==', ['get', 'dir'], -1], 180, 0],
      'icon-size': ['interpolate', ['linear'], ['zoom'], 15, 0.75, 18, 1.1],
    } });
  map.addLayer({ id: 'infra-arrows-lane', type: 'symbol', source: 'infra', minzoom: 14, maxzoom: 15,
    filter: ['all', ['!=', ['get', 'dir'], 0], LANE],
    layout: {
      'symbol-placement': 'line', 'symbol-spacing': 110, 'icon-rotation-alignment': 'map', 'icon-padding': 1,
      'icon-image': ['case', ['==', ['get', 'dir'], 2], 'arrow2', 'arrow'],
      'icon-rotate': ['case', ['==', ['get', 'dir'], -1], 180, 0],
      'icon-size': ['interpolate', ['linear'], ['zoom'], 15, 0.75, 18, 1.1],

  // sierżanty: podwójny chevron w kierunku jazdy
  map.addLayer({ id: 'infra-sharrow', type: 'symbol', source: 'infra', minzoom: 15, filter: ['all', ['==', ['get', 'sign'], 2], isCls('sharrow')],
    layout: {
      'symbol-placement': 'point', 'icon-rotation-alignment': 'map', 'icon-padding': 1,
      'icon-image': 'sharrowsign', 'icon-rotate': ['get', 'rot'],
      'icon-size': ['interpolate', ['exponential', 2], ['zoom'], 15, 0.55, 18, 0.9, 22, 2.6 * PX_PER_M(22) / 34],
    } });
  // znaki C-13 / C-13/16 co jakiś czas na drogach dla rowerów i ciągach
  map.addLayer({ id: 'infra-signs', type: 'symbol', source: 'infra', minzoom: 14.5, filter: ['==', ['get', 'sign'], 1],
    layout: {
      'symbol-placement': 'point', 'icon-rotation-alignment': 'viewport', 'icon-padding': 4,
      'icon-image': ['match', ['get', 'cls'], 'ciag', 'c13c16', 'c13'],
      'icon-size': ['interpolate', ['linear'], ['zoom'], 14.5, 0.7, 18, 1],
    } });

  // podświetlenie wybranego szlaku
  map.addLayer({ id: 'route-selected', type: 'line', source: 'routes', filter: ['==', ['get', 'rel'], -1],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffd60a', 'line-opacity': 0.75, 'line-offset': ROUTE_OFFSET,
      'line-width': z([[10, 6], [13, 8], [16, 11], [19, 16]]) } });

  for (const kind of ['hiking', 'bicycle']) {
    const isBike = kind === 'bicycle';
    map.addLayer({ id: `${kind}-casing`, type: 'line', source: 'routes', filter: ['==', ['get', 'kind'], kind],
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-opacity': 0.55, 'line-offset': ROUTE_OFFSET,
        'line-width': z([[10, 2.2], [13, 3.4], [16, 5], [19, 8]]) } });
    map.addLayer({ id: kind, type: 'line', source: 'routes', filter: ['==', ['get', 'kind'], kind],
      layout: { 'line-cap': isBike ? 'round' : 'butt', 'line-join': 'round' },
      paint: {
        'line-color': ['get', 'color'], 'line-offset': ROUTE_OFFSET, 'line-width': ROUTE_WIDTH,
        // rowerowe: kropki (kreska 0 + okrągłe zakończenie), piesze: kreski

  map.setPaintProperty('route-selected', 'line-width', z([[10, 6], [13, 8], [16, 11], [19, 16]]));

  requestTiles();
  setInterval(() => requestTiles(), 30 * 1000); // sprawdza co 30 s, czy któryś kafel jest starszy niż REFRESH_MS
  map.on('moveend', () => { if (!REGION.preload) requestTiles(); });
  if (!location.hash && REGION.preload) map.fitBounds([[REGION.bbox[1], REGION.bbox[0]], [REGION.bbox[3], REGION.bbox[2]]], { padding: 20, duration: 0 });
});

/* --- klik: dane relacji --- */
const INFRA_LAYERS = ['infra-casing', 'infra', 'infra-lanes', 'infra-kontrapas', 'infra-kontraruch', 'infra-zebra', 'infra-przejazd', 'infra-przejazd-sqR', 'infra-przejazd-sqL', 'infra-lane-in', 'infra-lane-out', 'infra-lane-sym', 'infra-arrows', 'infra-arrows-lane', 'infra-sharrow', 'infra-signs'];
const CLICK_LAYERS = ['bicycle', 'hiking', 'infra', 'infra-lanes', 'infra-kontrapas', 'infra-kontraruch', 'infra-przejazd'];
map.on('click', (ev) => {
  const p = ev.point, r = 7;
  const feats = map.queryRenderedFeatures([[p.x - r, p.y - r], [p.x + r, p.y + r]], { layers: CLICK_LAYERS.filter(l => map.getLayer(l)) });
  if (!feats.length) { closeInfo(); return; }
  const rels = [...new Set(feats.filter(f => !f.layer.id.startsWith('infra')).map(f => f.properties.rel))];
  const infraWays = [...new Set(feats.filter(f => f.layer.id.startsWith('infra')).flatMap(f => String(f.properties.ways || f.properties.way).split(',').map(Number)))].slice(0, 6);
  showInfo(rels, infraWays);
});
for (const l of CLICK_LAYERS) {
  map.on('mouseenter', l, () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', l, () => map.getCanvas().style.cursor = '');
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function tagTable(tags) {
  return '<table class="tags">' + Object.keys(tags).sort().map(k =>
    `<tr><td>${esc(k)}</td><td>${/^(website|url|wikipedia)$/.test(k) && /^https?:/.test(tags[k]) ? `<a href="${esc(tags[k])}" target="_blank" rel="noopener">${esc(tags[k])}</a>` : esc(tags[k])}</td></tr>`).join('') + '</table>';
}
const NET_PL = { icn: 'międzynarodowy', ncn: 'krajowy', rcn: 'regionalny', lcn: 'lokalny', iwn: 'międzynarodowy', nwn: 'krajowy', rwn: 'regionalny', lwn: 'lokalny' };

function showInfo(rels, infraWays) {
  const el = document.getElementById('info');
  let html = '<button class="close" aria-label="Zamknij">×</button>';
  for (const id of rels) {
    const t = routesById.get(id) || {};
    const kind = KIND[t.route] === 'bicycle' ? 'Szlak rowerowy' : 'Szlak pieszy';
    const wmt = KIND[t.route] === 'bicycle' ? 'cycling' : 'hiking';
    const meta = [kind, NET_PL[t.network], t.ref && `nr ${t.ref}`, t.distance && `${t.distance} km`, t.operator].filter(Boolean).map(esc).join(' · ');
    html += `<div class="route-card" data-rel="${id}">
      <h3><span class="chip" style="background:${routeColor(t)}"></span>${esc(t.name || t.ref || 'relacja ' + id)}</h3>
      <div class="meta">${meta}</div>
      <div class="links"><a href="https://www.openstreetmap.org/relation/${id}" target="_blank" rel="noopener">OSM</a>
        <a href="https://${wmt}.waymarkedtrails.org/#route?id=${id}" target="_blank" rel="noopener">Waymarked Trails</a>
        <a href="https://www.openstreetmap.org/edit?relation=${id}" target="_blank" rel="noopener">Edytuj</a>
        <a href="#" data-zoom="${id}">Przybliż</a></div>
      ${tagTable(t)}</div>`;
  }
  if (infraWays.length) {
    html += `<div class="route-card"><h3>Infrastruktura rowerowa</h3>`;
    for (const wid of infraWays) {
      const w = waysById.get(wid); if (!w) continue;
      const cls = infraClasses(w.tags).map(c => INFRA[c.cls].label + (c.side ? (c.side < 0 ? ' (lewa strona)' : ' (prawa strona)') : '') + (c.dir === 2 ? ', w obie strony' : c.dir ? ', jednokierunkowo' : ''));
      html += `<details ${rels.length ? '' : 'open'}><summary>${esc([...new Set(cls)].join(', '))} — <a href="https://www.openstreetmap.org/way/${wid}" target="_blank" rel="noopener">droga ${wid}</a></summary>${tagTable(w.tags)}</details>`;
    }
    html += '</div>';
  }
  el.innerHTML = html; el.classList.add('open'); el.scrollTop = 0;
  el.querySelector('.close').onclick = closeInfo;
  el.querySelectorAll('[data-zoom]').forEach(a => a.onclick = (e) => { e.preventDefault(); zoomToRel(+a.dataset.zoom); });
  el.querySelectorAll('.route-card[data-rel]').forEach(c => c.onmouseenter = () => select(+c.dataset.rel, false));
  select(rels[0] ?? null, false);
}
function closeInfo() { document.getElementById('info').classList.remove('open'); select(null); }
function select(id) {
  selectedRel = id;
  if (map.getLayer('route-selected')) map.setFilter('route-selected', ['==', ['get', 'rel'], id ?? -1]);
}
function zoomToRel(id) {
  const fs = map.getSource('routes')._data.features.filter(f => f.properties.rel === id);
  if (!fs.length) return;
  let b = new maplibregl.LngLatBounds();
  fs.forEach(f => f.geometry.coordinates.forEach(c => b.extend(c)));
  map.fitBounds(b, { padding: 60, maxZoom: 16 });
}

// --- ikony rysowane na canvasie (bez zewnętrznych plików) ---
const PR = 4; // gęstość pikseli ikon (4, bo symbol roweru na pasie bywa duży przy maksymalnym zoomie)
function canvasIcon(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w * PR; c.height = h * PR;
  const g = c.getContext('2d'); g.scale(PR, PR); g.lineJoin = 'round'; g.lineCap = 'round'; draw(g, w, h); return c;
}
function drawBike(g, cx, cy, s, col) {
  // prosty rower: dwa koła, rama, kierownica, siodełko (s = szerokość)
  const r = s * 0.2, lx = cx - s * 0.28, rx = cx + s * 0.28, wy = cy + s * 0.1;
  g.strokeStyle = col; g.lineWidth = Math.max(1, s * 0.07);
  g.beginPath(); g.arc(lx, wy, r, 0, 7); g.moveTo(rx + r, wy); g.arc(rx, wy, r, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(lx, wy); g.lineTo(cx - s * 0.02, wy); g.lineTo(cx + s * 0.16, cy - s * 0.16); g.lineTo(cx - s * 0.12, cy - s * 0.16);
  g.lineTo(lx, wy); g.moveTo(cx - s * 0.02, wy); g.lineTo(cx - s * 0.15, cy - s * 0.24); g.moveTo(cx - s * 0.21, cy - s * 0.24); g.lineTo(cx - s * 0.08, cy - s * 0.24);
  g.moveTo(rx, wy); g.lineTo(cx + s * 0.14, cy - s * 0.27); g.lineTo(cx + s * 0.23, cy - s * 0.29); g.stroke();
}
function drawWalker(g, cx, cy, s, col) {
  g.fillStyle = col; g.strokeStyle = col; g.lineWidth = Math.max(1, s * 0.11);
  g.beginPath(); g.arc(cx + s * 0.04, cy - s * 0.36, s * 0.12, 0, 7); g.fill();
  g.beginPath(); g.moveTo(cx, cy - s * 0.2); g.lineTo(cx - s * 0.04, cy + s * 0.1); g.lineTo(cx - s * 0.2, cy + s * 0.4);
  g.moveTo(cx - s * 0.04, cy + s * 0.1); g.lineTo(cx + s * 0.16, cy + s * 0.4);
  g.moveTo(cx - s * 0.2, cy - s * 0.02); g.lineTo(cx, cy - s * 0.16); g.lineTo(cx + s * 0.18, cy); g.stroke();
}
const SIGN_BLUE = '#1659c7';

    g.fillStyle = '#24508f'; g.strokeStyle = '#fff'; g.lineWidth = 1.6; g.stroke(); g.fill();

    g.lineTo(13.5, 10.5); g.lineTo(13.5, 7.8); g.lineTo(6.5, 7.8); g.lineTo(6.5, 10.5); g.closePath();
    g.fillStyle = '#24508f'; g.strokeStyle = '#fff'; g.lineWidth = 1.6; g.stroke(); g.fill();
  }),
  chevron2: canvasIcon(18, 14, (g) => {

    for (const [col, w] of [['#fff', 4.6], ['#0b3d91', 2.4]]) { g.strokeStyle = col; g.lineWidth = w; ch(3); g.stroke(); ch(9); g.stroke(); }
  }),
  // sierżant rowerowy (P-27): szare pole, rower i podwójny chevron w kierunku jazdy (w prawo = wzdłuż linii)
  sharrowsign: canvasIcon(34, 16, (g) => {
