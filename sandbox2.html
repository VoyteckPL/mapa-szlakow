<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sandbox dróg 2</title>
<link rel="stylesheet" href="sandbox2/styl.css?v=2">
</head>
<body>
<div id="bar">
  <button id="bUndo" title="Cofnij (Ctrl+Z)">↶</button>
  <button id="bZin" title="Przybliż">+</button>
  <button id="bZout" title="Oddal">−</button>
  <button id="bFit" title="Dopasuj widok">⤢</button>
  <button id="bOsie" class="on" title="Osie OSM, punkty, kierunki">⟋</button>
  <span class="sep"></span>
  <button id="bCopy" title="Kopiuj scenę dla Claude">⧉</button>
  <button id="bPaste" title="Wklej scenę">⤓</button>
  <span class="sep"></span>
  <button id="bTest" title="Testy geometrii (wszystkie sceny + losowe kąty)">✓</button>
  <span id="stat"></span>
</div>
<div id="side"><div id="sceny"></div><div id="testy"></div></div>
<canvas id="cv"></canvas>
<div id="ed"></div>
<div id="mod"><div><textarea id="modT" spellcheck="false"></textarea><div class="row"><button id="modOk">Wczytaj</button><button id="modX">Zamknij</button></div></div></div>
<div id="toast"></div>
<script>
/* skrypty ładowane po kolei z parametrem czasu – przeglądarka nigdy nie trzyma starej wersji */
(function(){var f=['sandbox2/1-geom.js', 'sandbox2/2-model.js', 'sandbox2/3-polaczenia.js', 'sandbox2/4-rysuj.js', 'sandbox2/5-ui.js', 'sandbox2/6-testy.js'],v=Date.now(),i=0;(function n(){if(i>=f.length)return;var e=document.createElement('script');e.src=f[i++]+'?v='+v;e.onload=n;document.body.appendChild(e);})();})();
</script>
</body>
</html>
