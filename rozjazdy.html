<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piaskownica rozjazdów</title>
<style>:root{--bg:#f4f5f7;--fg:#1d2433;--card:#fff;--mut:#5b6577;--ln:#d9dde4;--ac:#2f5fa7}@media(prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8ebf1;--card:#1d222b;--mut:#99a3b5;--ln:#2d3440;--ac:#7fa8e8}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;padding:16px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px}p.s{color:var(--mut);margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden}.c iframe{width:100%;height:300px;border:0;display:block;background:#ccc}.c .m{padding:8px 10px;font-size:13px;color:var(--mut)}.c b{color:var(--fg);font-size:15px}.c a{color:var(--ac)}
.zoom{margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.zoom button{padding:6px 10px;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:8px;font:inherit}</style></head><body>
<h1>Piaskownica rozjazdów</h1><p class="s">Prawdziwe rozjazdy 2→1+1 (i próbka 3→2+1) z mapy na ortofoto z aktualnym renderem. Napisz numer przypadku i co ma wyglądać inaczej. Kąty to odchylenie osi każdego wylotu od przedłużenia dwupasówki w pierwszych 8 m.</p>
<div class="zoom">Przybliżenie: <button data-z="19">19</button><button data-z="20">20</button><button data-z="21">21</button></div><div id="root"></div>
<script>const CASES=[{"typ": "2-1+1", "lat": 54.473692, "lon": 18.471717, "ang": [4, 6], "hw": ["motorway_link"], "lanes": [1, 1, 2], "cat": "A", "n": 1}, {"typ": "2-1+1", "lat": 54.449797, "lon": 18.437752, "ang": [12, 4], "hw": ["service", "motorway_link"], "lanes": [1, 1, 2], "cat": "B", "n": 2}, {"typ": "2-1+1", "lat": 54.457202, "lon": 18.450974, "ang": [3, 24], "hw": ["motorway_link"], "lanes": [1, 2, 1], "cat": "B", "n": 3}, {"typ": "2-1+1", "lat": 54.466682, "lon": 18.478939, "ang": [13, 0], "hw": ["motorway_link"], "lanes": [1, 2, 1], "cat": "B", "n": 4}, {"typ": "2-1+1", "lat": 54.468431, "lon": 18.477382, "ang": [1, 17], "hw": ["motorway_link"], "lanes": [1, 2, 1], "cat": "B", "n": 5}, {"typ": "2-1+1", "lat": 54.469137, "lon": 18.475448, "ang": [23, 4], "hw": ["motorway_link"], "lanes": [1, 2, 1], "cat": "B", "n": 6}, {"typ": "2-1+1", "lat": 54.473956, "lon": 18.472423, "ang": [15, 1], "hw": ["motorway_link"], "lanes": [1, 2, 1], "cat": "B", "n": 7}, {"typ": "2-1+1", "lat": 54.476987, "lon": 18.47199, "ang": [1, 22], "hw": ["motorway_link"], "lanes": [2, 1, 1], "cat": "B", "n": 8}, {"typ": "2-1+1", "lat": 54.477239, "lon": 18.472739, "ang": [33, 0], "hw": ["motorway_link"], "lanes": [1, 1, 2], "cat": "B", "n": 9}, {"typ": "2-1+1", "lat": 54.478198, "lon": 18.472877, "ang": [27, 1], "hw": ["motorway_link"], "lanes": [1, 2, 1], "cat": "B", "n": 10}, {"typ": "2-1+1", "lat": 54.498418, "lon": 18.462923, "ang": [4, 40], "hw": ["motorway_link"], "lanes": [1, 1, 2], "cat": "B", "n": 11}, {"typ": "2-1+1", "lat": 54.498615, "lon": 18.46105, "ang": [35, 4], "hw": ["motorway_link"], "lanes": [1, 1, 2], "cat": "B", "n": 12}, {"typ": "2-1+1", "lat": 54.500089, "lon": 18.460176, "ang": [4, 39], "hw": ["secondary", "motorway_link"], "lanes": [1, 1, 2], "cat": "B", "n": 13}, {"typ": "2-1+1", "lat": 54.540978, "lon": 18.496661, "ang": [2, 16], "hw": ["trunk_link", "trunk"], "lanes": [1, 1, 2], "cat": "B", "n": 14}, {"typ": "2-1+1", "lat": 54.44836, "lon": 18.435791, "ang": [15, 12], "hw": ["service", "motorway_link"], "lanes": [1, 2, 1], "cat": "C", "n": 15}, {"typ": "2-1+1", "lat": 54.453596, "lon": 18.445265, "ang": [8, 11], "hw": ["motorway_link"], "lanes": [1, 1, 2], "cat": "C", "n": 16}, {"typ": "2-1+1", "lat": 54.531168, "lon": 18.542313, "ang": [11, 11], "hw": ["trunk"], "lanes": [1, 2, 1], "cat": "C", "n": 17}, {"typ": "2-1+1", "lat": 54.54149, "lon": 18.495518, "ang": [19, 8], "hw": ["trunk_link", "trunk", "unclassified"], "lanes": [1, 2, 1], "cat": "C", "n": 18}, {"typ": "2-1+1", "lat": 54.541917, "lon": 18.496679, "ang": [2, 9], "hw": ["trunk_link", "unclassified"], "lanes": [1, 2, 1], "cat": "C", "n": 19}, {"typ": "2-1+1", "lat": 54.547711, "lon": 18.50438, "ang": [51, 10], "hw": ["trunk_link", "secondary"], "lanes": [1, 1, 2], "cat": "C", "n": 20}, {"typ": "3-2+1", "lat": 54.425444, "lon": 18.487851, "ang": [9, 1], "hw": ["motorway_link", "motorway"], "lanes": [1, 2, 3], "cat": "D", "n": 21}, {"typ": "3-2+1", "lat": 54.429957, "lon": 18.485988, "ang": [94, 0], "hw": ["motorway_link", "secondary"], "lanes": [1, 3, 2], "cat": "D", "n": 24}, {"typ": "3-2+1", "lat": 54.436388, "lon": 18.487855, "ang": [3, 9], "hw": ["motorway", "motorway_link"], "lanes": [2, 1, 3], "cat": "D", "n": 27}, {"typ": "3-2+1", "lat": 54.454186, "lon": 18.44563, "ang": [13, 3], "hw": ["motorway_link", "motorway"], "lanes": [2, 3, 1], "cat": "D", "n": 30}, {"typ": "3-2+1", "lat": 54.469133, "lon": 18.478104, "ang": [5, 16], "hw": ["motorway_link"], "lanes": [1, 2, 3], "cat": "D", "n": 33}, {"typ": "3-2+1", "lat": 54.471622, "lon": 18.472644, "ang": [9, 5], "hw": ["motorway_link"], "lanes": [2, 1, 3], "cat": "D", "n": 36}, {"typ": "3-2+1", "lat": 54.497851, "lon": 18.461885, "ang": [15, 1], "hw": ["motorway_link", "motorway"], "lanes": [1, 3, 2], "cat": "D", "n": 39}, {"typ": "3-2+1", "lat": 54.499853, "lon": 18.460093, "ang": [6, 37], "hw": ["motorway_link"], "lanes": [2, 3, 1], "cat": "D", "n": 42}, {"typ": "3-2+1", "lat": 54.531749, "lon": 18.510192, "ang": [48, 1], "hw": ["service", "trunk"], "lanes": [1, 3, 2], "cat": "D", "n": 45}, {"typ": "3-2+1", "lat": 54.53506, "lon": 18.490983, "ang": [6, 1], "hw": ["trunk", "trunk_link"], "lanes": [3, 1, 2], "cat": "D", "n": 48}, {"typ": "3-2+1", "lat": 54.535826, "lon": 18.491728, "ang": [0, 8], "hw": ["trunk", "trunk_link"], "lanes": [3, 2, 1], "cat": "D", "n": 51}, {"typ": "3-2+1", "lat": 54.541733, "lon": 18.45455, "ang": [1, 12], "hw": ["motorway", "motorway_link"], "lanes": [2, 3, 1], "cat": "D", "n": 54}],TITLES={"A": "A. Oba wyloty prawie prosto (symetrycznie)", "B": "B. Jeden wylot idzie prosto, drugi odchodzi pod k\u0105tem", "C": "C. Oba wyloty odchylone od przed\u0142u\u017cenia", "D": "D. Rozjazdy 3\u21922+1 (pr\u00f3bka)"};let Z=20;
function url(c,embed){return 'edytor-pasow.html'+(embed?'?embed=1':'')+'#map='+Z+'/'+c.lat+'/'+c.lon}
function draw(){const r=document.getElementById('root');r.innerHTML='';let cat='',g;for(const c of CASES){if(c.cat!==cat){cat=c.cat;const h=document.createElement('h2');h.textContent=TITLES[cat];r.appendChild(h);g=document.createElement('div');g.className='g';r.appendChild(g)}
const d=document.createElement('div');d.className='c';d.innerHTML='<iframe loading="lazy" src="'+url(c,1)+'"></iframe><div class="m"><b>Przypadek '+c.n+'</b> · '+c.typ.replace('-','→')+' · kąty '+c.ang.join('°, ')+'° · pasy '+c.lanes.join('/')+'<br>'+c.hw.join(', ')+' · <a href="'+url(c,0)+'" target="_blank">otwórz w edytorze</a> · <a href="https://www.openstreetmap.org/#map=19/'+c.lat+'/'+c.lon+'" target="_blank">OSM</a></div>';g.appendChild(d)}}
document.querySelectorAll('.zoom button').forEach(b=>b.onclick=()=>{Z=+b.dataset.z;draw()});draw();</script></body></html>
