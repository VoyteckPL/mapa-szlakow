<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Edytor pasów ruchu</title>
<style>
  :root { --bg:#f4f5f7; --pn:#fff; --tx:#1d2330; --mu:#667085; --ac:#2f6fae; --bd:#d8dce3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --pn:#1b212b; --tx:#e6e9ef; --mu:#97a1b3; --ac:#6aa8e6; --bd:#2f3745; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--tx); font:14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100%; }
  #stage { position:relative; flex:1; min-height:0; touch-action:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hint { position:absolute; left:8px; top:8px; pointer-events:none; font-size:12px; color:#fff; background:rgba(20,24,32,.74); padding:5px 9px; border-radius:8px; max-width:calc(100% - 16px); }
  #panel { background:var(--pn); border-top:1px solid var(--bd); max-height:42vh; overflow:auto; padding:8px 10px 14px; }
  @media (min-width: 860px) { #app { flex-direction:row; } #panel { order:-1; width:330px; max-height:none; border-top:0; border-right:1px solid var(--bd); } }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; align-items:center; }
  button, select, input { font:inherit; color:var(--tx); }
  button { background:var(--pn); border:1px solid var(--bd); border-radius:8px; padding:7px 10px; cursor:pointer; }
  button.on { background:var(--ac); border-color:var(--ac); color:#fff; }
  button.warn { color:#c0392b; }
  input[type=number], input[type=text], select { background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:5px 6px; width:80px; }
  input#lnk { width:100%; flex:1; min-width:0; }
  select { width:auto; }
  input[type=range] { width:110px; }
  label { display:inline-flex; align-items:center; gap:5px; color:var(--mu); font-size:13px; }
  h4 { margin:10px 0 2px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mu); }
  details { border-top:1px solid var(--bd); margin-top:10px; padding-top:6px; } summary { cursor:pointer; font-weight:600; }
  textarea { width:100%; height:80px; background:var(--bg); color:var(--tx); border:1px solid var(--bd); border-radius:6px; font:11px monospace; }
  .small { font-size:12px; color:var(--mu); }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hint"></div></div>
  <div id="panel">
    <div class="row"><input type="text" id="lnk" placeholder="Wklej link z openstreetmap.org (…#map=18/54.4985/18.4614)"><button id="bLnk" class="on">Wczytaj</button></div>
    <div class="small" id="st"></div>
    <div class="row" id="tools"></div>
    <div class="row" id="drawbar" style="display:none"><button id="bFinish" class="on">Zakończ</button><button id="bCancel" class="warn">Anuluj</button></div>
    <div class="row">
      <label><input type="checkbox" id="cTile" checked> podkład OSM</label>
      <label><input type="checkbox" id="cLay" checked> pasy (auto)</label>
      <label><input type="checkbox" id="cAx" checked> osie</label>
    </div>
    <div class="row">
      <label>pasy – krycie <input type="range" id="rA" min="0.2" max="1" step="0.05" value="0.85"></label>
      <button id="bImp">Wczytaj drogi z widoku</button><button id="bUndo">↶</button><button id="bRedo">↷</button>
    </div>
    <div id="props"></div>
    <details><summary>Dane</summary>
      <div class="row"><button id="bExp">Eksport JSON</button><button id="bImpJ">Wczytaj JSON</button><button id="bPng">Zapisz PNG</button><button id="bClr" class="warn">Wyczyść</button></div>
      <textarea id="io"></textarea>
      <div class="small">Zapisuje się też automatycznie w przeglądarce. Starsza wersja edytora: <a href="edytor-pasow-v2.html">v2</a>.</div>
    </details>
  </div>
</div>
<script>

const KEY = 'edytor-pasow-v3';

const HW_COL = { motorway: '#e0457b', trunk: '#e0457b', primary: '#e58a00', secondary: '#c9a400', tertiary: '#2f6fae', unclassified: '#6a7f94', residential: '#6a7f94', living_street: '#6a7f94', service: '#8d99a6', busway: '#6668ab' };

const ARR = new Set(['through', 'left', 'right', 'through-left', 'through-right', 'left-right', 'through-left-right', 'reverse']);
const TOOLS = [['sel', 'Zaznacz / przesuwaj'], ['pan', 'Widok'], ['osm', 'Dodaj drogę z OSM'], ['road', 'Rysuj drogę']];
const S = { org: { lat: 54.4985, lon: 18.4614 }, osm: { ways: new Map(), tiles: new Set() }, doc: { road: [] }, view: { x: 0, y: 0, k: 3 }, tool: 'sel', sel: -1, vsel: -1, draw: null, dirty: true, undo: [], redo: [] };

// ---------- geometria ----------
const w2s = p => [(p[0] - S.view.x) * S.view.k + W / 2, (p[1] - S.view.y) * S.view.k + H / 2];

}

}
function cumOf(Q) { const c = [0]; for (let i = 1; i < Q.length; i++) c.push(c[i - 1] + dist(Q[i - 1], Q[i])); return c; }

}

// ---------- model drogi ----------
const rw = r => r.lanes * r.lw;
function makeRoad(o, a, b) {
  const t = o.t, hw = t.highway || '', base = hw.replace('_link', ''), ow = ['yes', '1', 'true', '-1'].includes(t.oneway) || t.junction === 'roundabout' || (base === 'motorway' && t.oneway !== 'no');

const newRoad = (pts, nk) => ({ pts, nk, lanes: 2, lw: 3.5, oneway: false, centre: 'auto', marked: true, edge: false, kerb: true, osm: 0, name: '', hw: 'residential', tl: '', nf: 1 });

// ---------- warstwa OSM ----------

    const ins = o.g.map(p => p[0] >= x0 && p[0] <= x1 && p[1] >= y0 && p[1] <= y1), lo = ins.indexOf(true); if (lo < 0) continue;
    let i0 = lo, i1 = lo; for (let i = lo; i < ins.length; i++) { if (ins[i]) i1 = i; else if (i > i1 + 1) break; }
    const A = Math.max(0, i0 - 1), B = Math.min(o.g.length - 1, i1 + 1); if (B <= A) continue;

}
function osmAt(w, tol) { let best = null, bd = tol; for (const o of S.osm.ways.values()) for (let j = 1; j < o.g.length; j++) { const d = segDist(w, o.g[j - 1], o.g[j]); if (d < bd) { bd = d; best = o; } } return best; }
function parseLink(t) {

async function loadLink(txt) {
  const p = parseLink(txt); if (!p) { say('Nie rozpoznaję linku. Potrzebny fragment #map=zoom/lat/lon.'); return; }
  S.org = { lat: p.lat, lon: p.lon }; S.osm.ways.clear(); S.osm.tiles.clear(); S.doc = { road: [] }; S.sel = -1; S.vsel = -1; S.undo = []; S.redo = [];
  S.view = { x: 0, y: 0, k: Math.pow(2, p.z) / (156543.03 * Math.cos(p.lat * Math.PI / 180)) };
  say('Wczytuję…'); render(); await loadOsmAround(p.lat, p.lon); importView(); if (!S.doc.road.length) say('Brak danych dróg dla tego miejsca (dostępne: Gdynia i okolice).');

// ---------- układ automatyczny ----------
function comp(r) {
  const Q = dense(r.pts, 2), w = Q.map(() => rw(r)), d = Q.map(() => 0); return { Q, w, d, e: Q.map(() => 0), side: 1, cum: cumOf(Q) };
}
const orient = (c, st) => st ? c : { Q: c.Q.slice().reverse(), d: c.d.map(v => -v).reverse(), w: c.w.slice().reverse(), cum: c.cum.map(v => c.cum[c.cum.length - 1] - v).reverse() };

function unitFrom(c, st) { const o = orient(c, st), p = atS(o.Q, o.cum, Math.min(10, o.cum[o.cum.length - 1])), l = dist(o.Q[0], p) || 1; return [(p[0] - o.Q[0][0]) / l, (p[1] - o.Q[0][1]) / l]; }

        const oL = orient(C[yl.i], yl.st), oR = orient(C[yr.i], yr.st), A = edgeOf(oL, 1), B = edgeOf(oR, -1), cA = oL.cum, cB = oR.cum, smax = Math.min(cA[cA.length - 1], cB[cB.length - 1], 90);
        const rows = []; let started = false;
        for (let s = 0; s <= smax; s += 1.5) { const a = atS(A, cA, s), b = atS(B, cB, s), g = (b[0] - a[0]) * nR[0] + (b[1] - a[1]) * nR[1]; if (g > 0.25) started = true; if (started) { if (g > 9) break; rows.push({ s, a, b, g }); } }
        if (rows.length > 2) {

          if (G.some(e => /^(motorway|trunk)/.test(R[e.i].hw))) {
            let last = -99; const lerp = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];

              const r0 = rows[ri]; if (r0.g < 2.4 || r0.s - last < 6) continue; const s2 = Math.min(r0.s + 0.6 * r0.g, smax), a2 = atS(A, cA, s2), b2 = atS(B, cB, s2);

// ---------- strzałki ----------
function glyph(g, key) {

// ---------- rysowanie ----------

}

function resize() { const r = $('stage').getBoundingClientRect(); DPR = window.devicePixelRatio || 1; W = r.width; H = r.height; for (const c of [cv, off]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); } render(); }

// ---------- stan ----------
const snap = () => JSON.stringify(S.doc);

$('bUndo').onclick = () => { if (S.undo.length) { S.redo.push(snap()); restore(S.undo.pop()); } };
$('bRedo').onclick = () => { if (S.redo.length) { S.undo.push(snap()); restore(S.redo.pop()); } };
function moveNode(r, vi, x, y) { const k = r.nk[vi]; r.pts[vi] = [x, y]; if (k) for (const o of S.doc.road) o.nk.forEach((kk, j) => { if (kk === k) o.pts[j] = [x, y]; }); }

// ---------- UI ----------
function setTool(t) { S.tool = t; S.draw = t === 'road' ? { pts: [], nk: [] } : null; if (t !== 'sel') { S.vsel = -1; } ui(); render(); }
function ui() {
  $('tools').innerHTML = TOOLS.map(([k, n]) => `<button data-t="${k}" class="${S.tool === k ? 'on' : ''}">${n}</button>`).join('');
  $('tools').querySelectorAll('button').forEach(b => b.onclick = () => setTool(b.dataset.t));
  $('drawbar').style.display = S.draw ? 'flex' : 'none';
  $('hint').textContent = ({ sel: 'Przeciągnij punkt osi drogi – pasy i chevrony przeliczają się na żywo. Wspólne węzły ruszają razem. Dotknij drogi, by ją zaznaczyć (parametry w panelu).', pan: 'Przeciągaj, by przesuwać widok; dwa palce lub kółko zoomują.', osm: 'Dotknij szarej linii OSM, by dodać tę drogę.', road: 'Dotykaj kolejne punkty osi drogi; punkt blisko istniejącego węzła się z nim łączy. Potem „Zakończ”.' })[S.tool];

}
function numRow(label, val, fn, step = 1) { const id = 'n' + Math.random().toString(36).slice(2, 7); setTimeout(() => { const el = $(id); if (el) el.onchange = () => fn(parseFloat(el.value)); }); return `<label>${label}<input type="number" id="${id}" value="${val}" step="${step}"></label>`; }
function props() {
  const el = $('props'), r = S.doc.road[S.sel]; if (!r) { el.innerHTML = ''; return; }

    + `<button id="bRev">Odwróć kierunek</button>${S.vsel >= 0 ? '<button id="bDelV">Usuń punkt</button>' : ''}<button id="bDel" class="warn">Usuń drogę</button></div>`;

}
$('bLnk').onclick = () => loadLink($('lnk').value);
$('lnk').addEventListener('keydown', e => { if (e.key === 'Enter') loadLink($('lnk').value); });
$('lnk').addEventListener('paste', () => setTimeout(() => { if (parseLink($('lnk').value)) loadLink($('lnk').value); }));
$('bImp').onclick = () => { push(); importView(); };
for (const id of ['cTile', 'cLay', 'cAx', 'rA']) $(id).oninput = () => render();

$('bExp').onclick = () => { $('io').value = JSON.stringify({ org: S.org, doc: S.doc }); };
$('bImpJ').onclick = () => { try { const j = JSON.parse($('io').value); if (j.org) S.org = j.org; S.doc = j.doc || j; S.sel = -1; save(); ui(); touch(); } catch (e) { say('Błędny JSON'); } };
$('bClr').onclick = () => { push(); S.doc = { road: [] }; S.sel = -1; save(); ui(); touch(); };

// ---------- wskaźnik ----------

function endPtr(e) {

    else if (S.tool === 'osm') { const o = osmAt(d.w, 12 / S.view.k); if (o && !S.doc.road.some(r => r.osm === o.id)) { push(); S.doc.road.push(makeRoad(o, 0, o.g.length - 1)); S.sel = S.doc.road.length - 1; setTool('sel'); touch(); } }
    else if (S.draw) { const v = nearVertex(w2s(d.w), 14); let pt = d.w, nk = null; if (v) { const r = S.doc.road[v.i]; pt = r.pts[v.vi].slice(); nk = r.nk[v.vi] || null; if (!nk) { nk = 'n' + Math.random().toString(36).slice(2, 9); r.nk[v.vi] = nk; } } S.draw.pts.push(pt); S.draw.nk.push(nk); render(); }

cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { e.preventDefault(); const p = evp(e), w = s2w(p), f = Math.exp(-e.deltaY * 0.0015); S.view.k = Math.max(0.5, Math.min(200, S.view.k * f)); S.view.x = w[0] - (p[0] - W / 2) / S.view.k; S.view.y = w[1] - (p[1] - H / 2) / S.view.k; render(); }, { passive: false });
window.addEventListener('keydown', e => { if (e.key === 'Enter' && S.draw && document.activeElement.tagName !== 'INPUT') finishDraw(); if (e.key === 'Escape') setTool('sel'); });
window.addEventListener('resize', resize);

// ---------- start ----------
(async function () {
  resize(); ui();
  const h = decodeURIComponent(location.hash || '') + ' ' + location.search;
  if (parseLink(location.hash) && /#map=/.test(h)) { $('lnk').value = location.hash; await loadLink(h); return; }
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.doc && s.doc.road) { S.doc = s.doc; S.view = s.view; S.org = s.org; await loadOsmAround(S.org.lat, S.org.lon); touch(); say(`Przywrócono ${S.doc.road.length} dróg.`); return; } } catch (e) {}
